<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>每周小问卷</title>
<script>
/* ====== SETUP: edit these three lines ====== */
const NTFY_URL   = "https://ntfy.sh/ens-2gqIIsH24xR4arHSYwhuh1oV"; // public ntfy.sh with a random private topic
const NTFY_TOKEN = "";   // optional: a write-only access token (tk_...) for that topic; leave "" for none
// Supabase: totals only, insert-only table (nobody can read it with these keys)
const SB_URL     = "https://zskqjwwcyczezouglzmi.supabase.co";
const SB_KEY     = "sb_publishable_PHSU2XfYkdnbAR1mZ8IC8A_TWKIXChx";
const SB_LEGACY  = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpza3Fqd3djeWN6ZXpvdWdsem1pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyMDMzMDEsImV4cCI6MjA5Njc3OTMwMX0.ofebeGhucWa6G7MpoUIyJhthK2CnK8PPkAPINg7HW7s";
</script>
<style>
:root{--bg:#EEF4F2;--card:#fff;--ink:#16343A;--muted:#5C7377;--line:#CFDDDA;--tide:#3E8E85;--tide-soft:#DCEEEA;--sun:#E9A93B;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0F1E21;--card:#17292D;--ink:#E3EFEC;--muted:#93AAAD;--line:#2A4247;--tide:#5FB3A8;--tide-soft:#1F3A3A;--sun:#F0B84F}}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;font-size:18px;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 40px;min-height:100%;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.9rem}
.lang{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:20px;padding:4px 12px}
.bar{height:6px;background:var(--line);border-radius:3px;margin:14px 0 22px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--tide);transition:width .3s}
h1{font-size:1.5rem;line-height:1.3;margin:6px 0 12px}
.q{font-size:1.25rem;line-height:1.5;margin:4px 0 20px}
.stem{color:var(--muted);font-size:.95rem}
.opt{all:unset;box-sizing:border-box;display:block;width:100%;cursor:pointer;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 10px}
.opt.on{border-color:var(--tide);background:var(--tide-soft)}
.opt:focus-visible,.btn:focus-visible,.lang:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:block;text-align:center;width:100%;padding:14px;border-radius:12px;background:var(--tide);color:#fff;font-weight:600;margin-top:14px}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.note{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:.95rem;margin:12px 0}
.help{border-left:4px solid var(--sun)}
.scores{font-size:1.1rem}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const P=new URLSearchParams(location.search);
const SET=P.get("s")==="ens"?"ens":"full";
const CP=P.get("cp")||"baseline";
let L="zh";

const OPT4={zh:["完全不会","好几天","一半以上的天数","几乎每天"],en:["Not at all","Several days","More than half the days","Nearly every day"]};
const OPT6={zh:["没有问题","非常轻微","轻微","中等","严重","最严重"],en:["No problem","Very mild","Mild","Moderate","Severe","As bad as it can be"]};
const GAD={zh:["感觉紧张、焦虑或烦躁","不能够停止或控制担忧","对各种各样的事情担忧过多","很难放松下来","由于不安而无法静坐","变得容易烦恼或急躁","感到似乎将有可怕的事情发生而害怕"],
 en:["Feeling nervous, anxious or on edge","Not being able to stop or control worrying","Worrying too much about different things","Trouble relaxing","Being so restless that it's hard to sit still","Becoming easily annoyed or irritable","Feeling afraid, as if something awful might happen"]};
const PHQ={zh:["做事时提不起劲或没有兴趣","感到心情低落、沮丧或绝望","入睡困难、睡不安稳或睡眠过多","感觉疲倦或没有活力","食欲不振或吃太多","觉得自己很糟，或觉得自己很失败，或让自己或家人失望","对事物专注有困难，例如阅读报纸或看电视时","动作或说话速度缓慢到别人已经察觉？或者相反，烦躁或坐立不安、动来动去的情况比平常更多","有不如死掉或用某种方式伤害自己的念头"],
 en:["Little interest or pleasure in doing things","Feeling down, depressed or hopeless","Trouble falling or staying asleep, or sleeping too much","Feeling tired or having little energy","Poor appetite or overeating","Feeling bad about yourself, or that you are a failure or have let yourself or your family down","Trouble concentrating, such as reading the newspaper or watching television","Moving or speaking so slowly that others could notice, or the opposite, being so fidgety or restless that you move around much more than usual","Thoughts that you would be better off dead, or of hurting yourself in some way"]};
const ENS={zh:["鼻腔干燥","感觉鼻腔气流减少","窒息感","感觉鼻子太通、太空","鼻腔结痂","鼻腔灼热感"],
 en:["Nasal dryness","Sense of diminished nasal airflow","Suffocation","Nose feels too open","Nasal crusting","Nasal burning"]};
const STEM={gad:{zh:"过去两周，以下问题困扰你的频率：",en:"Over the last 2 weeks, how often have you been bothered by:"},
 phq:{zh:"过去两周，以下问题困扰你的频率：",en:"Over the last 2 weeks, how often have you been bothered by:"},
 ens:{zh:"最近一周，以下鼻部症状有多严重：",en:"In the past week, how severe has this nose symptom been:"}};

const Qs=[];
if(SET==="full"){GAD.zh.forEach((_,i)=>Qs.push({g:"gad",i,o:OPT4}));PHQ.zh.forEach((_,i)=>Qs.push({g:"phq",i,o:OPT4}))}
ENS.zh.forEach((_,i)=>Qs.push({g:"ens",i,o:OPT6}));
const A=new Array(Qs.length).fill(null); // answers stay in this page's memory only, never stored or sent
let step=-1;

const TX={
 zh:{title:"每周小问卷",intro:"这份问卷帮助我们看看你是不是在一点点变好。大约需要"+(SET==="full"?"5分钟":"1分钟")+"。",
  priv:"你的每一题答案只留在你的手机上，不会被保存，也不会发给任何人。只会记录三个总分，并在需要时发送一条联系你的提醒。",
  start:"开始",back:"上一题",send:"提交",sending:"正在提交…",
  done:"提交好了，谢谢你 ❤️",doneSub:"你今天又为自己做了一件好事。",
  fail:"没有发送成功。请把这个页面截图发给发你链接的人，截图里只有总分。",retry:"再试一次",
  scores:"你的总分",gad:"焦虑",phq:"情绪",ens:"鼻部症状",
  help:"谢谢你诚实地回答。你不是一个人。现在就可以打心理援助热线 12356，紧急情况拨打 120。也可以联系发你链接的人或你信任的人。",
  of:"第 {a} 题，共 {b} 题"},
 en:{title:"Weekly check-in",intro:"This helps us see whether you're getting a little better. It takes about "+(SET==="full"?"5 minutes":"1 minute")+".",
  priv:"Your answers stay on your phone and are not saved or sent to anyone. Only three total scores will be recorded, and a notice to contact you as needed.",
  start:"Start",back:"Back",send:"Submit",sending:"Submitting…",
  done:"Submitted. Thank you ❤️",doneSub:"You did something good for yourself today.",
  fail:"It didn't send. Please screenshot this page and send it to the person who shared this link. The screenshot only shows totals.",retry:"Try again",
  scores:"Your totals",gad:"Anxiety",phq:"Mood",ens:"Nose symptoms",
  help:"Thank you for answering honestly. You are not alone. You can call the psychological assistance hotline 12356 now, or 120 in an emergency. You can also reach out to the person who shared this link, or someone you trust.",
  of:"Question {a} of {b}"}
};
const $=document.getElementById("app");
function hdr(p){return `<div class="top"><span>${TX[L].title}</span><button class="lang" id="lg">${L==="zh"?"English":"中文"}</button></div><div class="bar"><i style="width:${p}%"></i></div>`}
function bindLang(){document.getElementById("lg").onclick=()=>{L=L==="zh"?"en":"zh";document.documentElement.lang=L==="zh"?"zh-CN":"en";render()}}
function totals(){const s={gad:0,phq:0,ens:0};Qs.forEach((q,k)=>{s[q.g]+=A[k]||0});return s}
function flag(){const k=Qs.findIndex(q=>q.g==="phq"&&q.i===8);return k>=0&&A[k]>0}

function render(){
 const t=TX[L];
 if(step===-1){$.innerHTML=hdr(0)+`<h1>${t.intro}</h1><div class="note">${t.priv}</div><button class="btn" id="go">${t.start}</button>`;
  bindLang();document.getElementById("go").onclick=()=>{step=0;render()};return}
 if(step<Qs.length){const q=Qs[step],src=q.g==="gad"?GAD:q.g==="phq"?PHQ:ENS;
  let h=hdr(Math.round(step/Qs.length*100))+`<div class="stem">${t.of.replace("{a}",step+1).replace("{b}",Qs.length)} · ${STEM[q.g][L]}</div><div class="q">${src[L][q.i]}</div>`;
  q.o[L].forEach((o,v)=>{h+=`<button class="opt${A[step]===v?" on":""}" data-v="${v}">${o}</button>`});
  if(step>0)h+=`<button class="btn ghost" id="bk">${t.back}</button>`;
  $.innerHTML=h;bindLang();
  $.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{A[step]=+b.dataset.v;step++;render()});
  const bk=document.getElementById("bk");if(bk)bk.onclick=()=>{step--;render()};
  const first=$.querySelector(".opt");if(first)first.focus({preventScroll:true});
  return}
 // review + submit
 $.innerHTML=hdr(100)+`<h1>${L==="zh"?"都答完了":"All done"}</h1><button class="btn" id="sb">${t.send}</button><button class="btn ghost" id="bk">${t.back}</button>`;
 bindLang();document.getElementById("bk").onclick=()=>{step--;render()};document.getElementById("sb").onclick=submit;
}
function authParam(){if(!NTFY_TOKEN)return"";return"&auth="+btoa("Bearer "+NTFY_TOKEN).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
async function post(title,msg,priority,tags){
 // Simple POST with query parameters (no custom headers, so no CORS preflight)
 const u=NTFY_URL+"?title="+encodeURIComponent(title)+"&priority="+priority+"&tags="+encodeURIComponent(tags)+authParam();
 const r=await fetch(u,{method:"POST",body:msg});if(!r.ok)throw new Error("HTTP "+r.status);
}
async function saveScores(s){
 const row={cp:CP.slice(0,32),set_type:SET,gad:SET==="full"?s.gad:null,phq:SET==="full"?s.phq:null,ens:s.ens};
 const url=SB_URL+"/rest/v1/checkin_scores";
 const body=JSON.stringify(row);
 let r=await fetch(url,{method:"POST",headers:{"apikey":SB_KEY,"Content-Type":"application/json","Prefer":"return=minimal"},body});
 if(r.status===401||r.status===403){ // fall back to the legacy anon key
  r=await fetch(url,{method:"POST",headers:{"apikey":SB_LEGACY,"Authorization":"Bearer "+SB_LEGACY,"Content-Type":"application/json","Prefer":"return=minimal"},body});
 }
 if(!r.ok)throw new Error("save "+r.status);
}
function totalsText(s){return (SET==="full"?[`GAD-7 ${s.gad}/21`,`PHQ-9 ${s.phq}/27`,`ENS6Q ${s.ens}/30`]:[`ENS6Q ${s.ens}/30`]).join(" · ")}
async function send(s,f){
 let saved=true;
 try{await saveScores(s)}catch(e){saved=false}
 let pinged=true;
 try{
  // Totals go in the alert only if saving to the tracker failed, as a backup
  await post("Check-in "+CP,saved?"New check-in received. Scores are in your tracker.":"Tracker save failed. Totals: "+totalsText(s),3,"bar_chart");
  if(f) await post("Please check in with her today","She may be having a hard time. Reach out kindly today. (Her answers are private.)",5,"heart");
 }catch(e){pinged=false}
 return saved||pinged;
}
async function submit(){
 const t=TX[L],s=totals(),f=flag();
 const btn=document.getElementById("sb");btn.textContent=t.sending;btn.style.pointerEvents="none";
 done(await send(s,f),s,f);
}
function done(ok,s,f){
 const t=TX[L];
 let h=hdr(100)+`<h1>${ok?t.done:""}</h1>${ok?`<p class="stem">${t.doneSub}</p>`:`<div class="note help">${t.fail}</div>`}`;
 h+=`<div class="note scores"><strong>${t.scores}</strong><br>${SET==="full"?`${t.gad}: ${s.gad}/21<br>${t.phq}: ${s.phq}/27<br>`:""}${t.ens}: ${s.ens}/30<br><span class="stem">${CP}</span></div>`;
 if(f)h+=`<div class="note help">${t.help}</div>`;
 if(!ok)h+=`<button class="btn" id="rt">${t.retry}</button>`;
 $.innerHTML=h;const lg=document.getElementById("lg");if(lg)lg.onclick=()=>{L=L==="zh"?"en":"zh";done(ok,s,f)};
 const rt=document.getElementById("rt");if(rt)rt.onclick=async()=>{rt.textContent=t.sending;rt.style.pointerEvents="none";done(await send(s,f),s,f)};
}
render();
</script>
</body>
</html>
