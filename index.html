<title>小猪加油</title>
<style>
:root{
  --bg:#FFF5F0;--card:#FFFDFB;--ink:#3B2530;--muted:#8E6F7C;--line:#F4DED7;
  --pink:#FF7FA8;--pink-soft:#FFE1EB;--mint:#3FB59B;--mint-soft:#DDF5EE;--gold:#F5B640;--gold-soft:#FFF1D2;--lilac:#9B87E8;
  --shadow:0 6px 18px rgba(214,99,140,.12);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1E1519;--card:#2A1E24;--ink:#F8E9EF;--muted:#BFA2AE;--line:#3D2C34;
  --pink:#FF8FB3;--pink-soft:#46262F;--mint:#56C9AE;--mint-soft:#1F3A33;--gold:#F7C25A;--gold-soft:#3D3220;--lilac:#B3A3F0;--shadow:none}}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC",system-ui,sans-serif;font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain}
button{font:inherit;color:inherit}
.wrap{max-width:520px;margin:0 auto;padding:12px 16px calc(96px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;gap:14px;padding:8px 0 4px}
.pig{width:68px;height:68px;flex:none;position:relative}
.pig svg{width:100%;height:100%;display:block}
.pig .lv{position:absolute;right:-6px;bottom:-4px;background:var(--gold);color:#3B2530;font-size:.72rem;font-weight:800;border-radius:10px;padding:1px 7px;border:2px solid var(--bg)}
.hello h1{font-size:1.45rem;line-height:1.2;margin:0}
.hello .sub{color:var(--muted);font-size:.9rem}
.lang{all:unset;margin-left:auto;align-self:flex-start;font-size:.8rem;color:var(--muted);border:1px solid var(--line);border-radius:14px;padding:3px 10px;cursor:pointer}
.xp{margin:12px 0 4px;display:flex;align-items:center;gap:10px;font-size:.85rem;color:var(--muted)}
.xpbar{flex:1;height:10px;border-radius:6px;background:var(--pink-soft);overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--gold));border-radius:6px;transition:width .6s cubic-bezier(.2,.9,.3,1.3)}
.chips{display:flex;gap:8px;margin:8px 0 14px;flex-wrap:wrap}
.chip{background:var(--card);border-radius:14px;padding:6px 12px;font-size:.88rem;box-shadow:var(--shadow);border:1px solid var(--line)}
.card{background:var(--card);border-radius:22px;padding:16px;margin:0 0 14px;box-shadow:var(--shadow);border:1px solid var(--line)}
.note{background:linear-gradient(160deg,#FFEFE6,#FFF9F4 60%,#FFFDFB);border:1px solid #F4DED7;position:relative}
.note .nhead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.note .ava{width:46px;height:46px;border-radius:50%;flex:none;object-fit:cover;box-shadow:0 2px 8px rgba(120,64,80,.18);background:#FFE4EC}
.note .letter{font-size:1.05rem;line-height:1.6;margin:0 0 6px}
body.en .note .letter{font-family:"Patrick Hand","Nunito",cursive;font-size:1.32rem;line-height:1.45;letter-spacing:.2px}
.note .sig{text-align:right;color:var(--muted);margin:0 4px 10px;font-size:.95rem}
body.en .note .sig{font-family:"Patrick Hand",cursive;font-size:1.2rem}
body.en{font-family:"Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.party .from{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px;color:var(--muted)}
.party .from img{width:34px;height:34px;border-radius:50%;object-fit:cover}
@media (prefers-color-scheme:dark){.note{background:linear-gradient(160deg,#3A2229,#2A1E24);border-color:#4A2F38}}
.note .from{font-size:.8rem;color:var(--muted);margin-bottom:4px}
.note p{margin:0 0 10px;font-size:1.02rem}
.hug{all:unset;cursor:pointer;background:var(--pink);color:#fff;border-radius:16px;padding:9px 16px;font-weight:700;font-size:.95rem}
.hug:active{transform:scale(.96)}
h2{font-size:1.1rem;margin:4px 0 10px;display:flex;align-items:center;gap:8px}
h2 .count{margin-left:auto;font-size:.9rem;color:var(--muted);font-weight:600}
.ring{width:22px;height:22px}
.task{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:12px 14px;margin:0 0 10px;border-radius:18px;background:var(--bg);border:2px solid transparent;transition:transform .15s,background .25s,border-color .25s;position:relative}
.task:active{transform:scale(.98)}
.task .em{font-size:1.6rem;width:36px;text-align:center;flex:none}
.task .tx{flex:1;font-size:1rem;line-height:1.35}
.task .tx small{display:block;color:var(--muted);font-size:.78rem;margin-top:2px}
.task .ck{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--line);flex:none;display:grid;place-items:center;font-size:1rem;color:#fff;transition:all .25s}
.task.done{background:var(--mint-soft);border-color:var(--mint)}
.task.done .tx{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--mint)}
.task.done .ck{background:var(--mint);border-color:var(--mint)}
.task.pop{animation:pop .45s cubic-bezier(.2,.9,.3,1.5)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.05)}100%{transform:scale(1)}}
.float{position:fixed;pointer-events:none;font-weight:800;color:var(--pink);font-size:1.1rem;animation:up 1s ease-out forwards;z-index:60}
@keyframes up{to{transform:translateY(-60px);opacity:0}}
.tomorrow{text-align:center;color:var(--muted);font-size:.88rem;padding:6px 0 4px}
.treatday{display:flex;align-items:center;gap:12px;background:var(--gold-soft);border-radius:18px;padding:12px 14px}
.treatday .em{font-size:1.8rem}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;text-align:center;background:var(--pink);color:#fff;font-weight:800;border-radius:18px;padding:15px;font-size:1.05rem;min-height:52px}
.btn.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn.mint{background:var(--mint)}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.5}
.survey{background:linear-gradient(135deg,#EDE7FF,var(--card))}
@media (prefers-color-scheme:dark){.survey{background:linear-gradient(135deg,#2E2747,var(--card))}}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:30}
.tabs button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--muted);padding:4px 6px;border-radius:12px;flex:1;min-width:0}
.tabs button .ti{font-size:1.45rem;line-height:1}
.tabs button[aria-selected="true"]{color:var(--pink);font-weight:700}
/* badges */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

/* ---------- api ---------- */
async function rpc(fn,args){
  const body=JSON.stringify(Object.assign({p_key:KEY},args||{}));
  const url=SB_URL+"/rest/v1/rpc/"+fn;
  let r=await fetch(url,{method:"POST",headers:{"apikey":SB_KEY,"Content-Type":"application/json"},body});
  if(r.status===401){r=await fetch(url,{method:"POST",headers:{"apikey":SB_LEGACY,"Authorization":"Bearer "+SB_LEGACY,"Content-Type":"application/json"},body})}
  if(!r.ok){const e=new Error("rpc "+r.status);e.status=r.status;throw e}
  const txt=await r.text();return txt?JSON.parse(txt):null;
}
async function ping(title,msg,priority,tags){
  try{await fetch(NTFY_URL+"?title="+encodeURIComponent(title)+"&priority="+(priority||3)+"&tags="+encodeURIComponent(tags||"pig"),{method:"POST",body:msg})}catch(e){}
}

let ST=null,TAB="today";
function todayPlan(){const d=(ST.days||[]).find(x=>x.day===ST.today);return (d&&Array.isArray(d.tasks)&&d.tasks.length)?d.tasks:defaultTasks()}
function todayNote(){const d=(ST.days||[]).find(x=>x.day===ST.today);return d?{zh:d.msg_zh,en:d.msg_en}:null}
function doneSet(day){const s=new Set();(ST.task_log||[]).forEach(r=>{if(r.day===day&&r.done)s.add(r.task_id)});return s}
function planFor(day){const d=(ST.days||[]).find(x=>x.day===day);return (d&&Array.isArray(d.tasks)&&d.tasks.length)?d.tasks:defaultTasks()}
function stats(){
  const s={tasks:0,fullDays:0,checkins:(ST.checkins||[]).length,surveys:(ST.scores_done||[]).filter(c=>CPS.some(x=>x.id===c)).length,
    did:{},calm:0,goodSleep:0,ideas:(ST.treats||[]).filter(x=>x.added_by==="her").length,breath:0,walks:0,treats:(ST.treat_log||[]).length,best:0,cur:0,activeDays:0,today:ST.today};
  (ST.checkins||[]).forEach(c=>{if(c.panic===0)s.calm++;if(c.sleep!=null&&+c.sleep>=7)s.goodSleep++});
  const active=[];
  for(let d=1;d<=ST.today;d++){
    const plan=planFor(d),done=doneSet(d);let n=0;
    plan.forEach(tk=>{if(done.has(tk.id)){n++;s.tasks++;s.did[tk.id.replace(/\d+$/,"")]=true;if(/^breathe/.test(tk.id))s.breath++;if(/^walk/.test(tk.id))s.walks++}});
    if(n>0)s.activeDays++;
    if(plan.length&&n===plan.length)s.fullDays++;
    active.push(n>0);
  }
  let run=0;active.forEach(a=>{run=a?run+1:0;if(run>s.best)s.best=run});
  let cur=0;for(let i=active.length-1;i>=0;i--){if(active[i])cur++;else if(i===active.length-1)continue;else break}
  s.cur=cur;
  s.dreams=(ST.dreams||[]).length;s.routines=(ST.routine_runs||[]).filter(r=>r.done>0).length;s.journey=(ST.lessons_seen||[]).filter(x=>String(x).startsWith("j_")).length;s.lessons=(ST.lessons_seen||[]).length-s.journey;s.journals=(ST.journal||[]).length;
  s.xp=s.tasks*10+s.checkins*10+s.fullDays*30+s.surveys*20+s.dreams*10+s.routines*15+s.lessons*5+s.journals*10+s.journey*20;
  s.level=Math.floor(s.xp/100)+1;s.inLevel=s.xp%100;
  return s;
}

function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=document.getElementById("cf"),x=c.getContext("2d"),dpr=Math.min(2,devicePixelRatio||1);
  c.width=innerWidth*dpr;c.height=innerHeight*dpr;x.scale(dpr,dpr);
  const cols=["#FF7FA8","#F5B640","#3FB59B","#9B87E8","#FFC2D6"];
  const P=Array.from({length:120},()=>({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*12,vy:Math.random()*-12-4,r:Math.random()*6+4,c:cols[Math.floor(Math.random()*cols.length)],a:Math.random()*6,s:Math.random()<.3}));
  let f=0;(function tick(){x.clearRect(0,0,innerWidth,innerHeight);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;
    if(p.s){x.beginPath();x.arc(0,0,p.r/1.6,0,7);x.fill()}else x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});if(++f<110)requestAnimationFrame(tick);else x.clearRect(0,0,innerWidth,innerHeight)})();
}

/* ---------- your voice: recordings stored in Supabase, played at an even volume ---------- */
const AUD={ref:null,playing:false,ctx:null,src:null,el:null,cache:{},loading:false};
function stopRecording(){
  try{if(AUD.src){AUD.src.onended=null;AUD.src.stop()}}catch(e){}
  try{if(AUD.ctx)AUD.ctx.close()}catch(e){}
  try{if(AUD.el){AUD.el.onended=null;AUD.el.pause()}}catch(e){}
  AUD.src=null;AUD.ctx=null;AUD.el=null;AUD.playing=false;AUD.loading=false;
}
// how much to turn a recording up or down so speech lands at the same level (about -18 dBFS RMS)
function loudnessGain(buf){
  const n=buf.length,ch=buf.numberOfChannels,sr=buf.sampleRate||44100,F=Math.max(256,Math.round(sr*.05));const data=[];for(let c=0;c<ch;c++)data.push(buf.getChannelData(c));
  const frames=[];let peak=0;
  for(let i=0;i<n;i+=F){let s=0,m=0;const end=Math.min(n,i+F);for(let j=i;j<end;j++){let v=0;for(let c=0;c<ch;c++)v+=data[c][j];v/=ch;s+=v*v;const a=Math.abs(v);if(a>m)m=a}frames.push(Math.sqrt(s/Math.max(1,end-i)));if(m>peak)peak=m}
  if(!frames.length||peak<1e-5)return 1;
  const loud=Math.max(...frames),speech=frames.filter(r=>r>loud*.12&&r>.002);if(!speech.length)return 1;
  const rms=Math.sqrt(speech.reduce((a,r)=>a+r*r,0)/speech.length);
  return Math.min(10,Math.max(.25,.125/rms));
}
// must run inside the tap: phones (iPhones especially) only allow sound to start from a tap
function unlockAudio(){
  try{if(navigator.audioSession)navigator.audioSession.type="playback"}catch(e){} // play even when the iPhone ringer switch is on silent (iOS 17+)
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;
  let ctx=null;try{ctx=new AC()}catch(e){return null}
  try{ctx.resume()}catch(e){}
  try{const b=ctx.createBuffer(1,1,22050),s=ctx.createBufferSource();s.buffer=b;s.connect(ctx.destination);s.start(0)}catch(e){}
  return ctx;
}
function playRecording(ref){
  // second tap on the same recording: pause / resume (still inside the tap)
  if(AUD.ref===ref&&(AUD.ctx||AUD.el)&&!AUD.loading){
    if(AUD.ctx){if(AUD.playing){AUD.ctx.suspend();AUD.playing=false}else{AUD.ctx.resume();AUD.playing=true}}
    else if(AUD.el){if(AUD.playing){AUD.el.pause();AUD.playing=false}else{AUD.el.play();AUD.playing=true}}
    return drawLesson();
  }
  stopRecording();try{speechSynthesis.cancel()}catch(e){}
  const ctx=unlockAudio();
  AUD.ref=ref;AUD.ctx=ctx;AUD.playing=true;AUD.loading=true;SPEAK=false;drawLesson();
  (async()=>{
    try{
      let c=AUD.cache[ref];
      if(!c){const r=await rpc("care_audio_get",{p_ref:ref});if(!r||!r.b64)throw new Error("none");
        const bin=atob(r.b64),u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);c=AUD.cache[ref]={bytes:u8,mime:r.mime}}
      if(AUD.ref!==ref||AUD.ctx!==ctx)return; // closed or switched while loading
      if(ctx){
        try{
          if(!c.buf){c.buf=await ctx.decodeAudioData(c.bytes.buffer.slice(0));c.gain=loudnessGain(c.buf)}
          if(AUD.ref!==ref||AUD.ctx!==ctx)return;
          const src=ctx.createBufferSource();src.buffer=c.buf;
          const g=ctx.createGain();g.gain.value=c.gain;
          const lim=ctx.createDynamicsCompressor();lim.threshold.value=-3;lim.knee.value=0;lim.ratio.value=20;lim.attack.value=.003;lim.release.value=.25;
          src.connect(g);g.connect(lim);lim.connect(ctx.destination);
          src.onended=()=>{if(AUD.src===src){stopRecording();drawLesson()}};
          AUD.src=src;if(ctx.state!=="running"){try{await ctx.resume()}catch(e){}}
          src.start();AUD.loading=false;AUD.playing=true;return drawLesson();
        }catch(e){try{ctx.close()}catch(_){}AUD.ctx=null}
      }
      const url=c.url||(c.url=URL.createObjectURL(new Blob([c.bytes],{type:c.mime})));const el=new Audio(url);AUD.el=el;
      el.onended=()=>{if(AUD.el===el){stopRecording();drawLesson()}};await el.play();AUD.loading=false;AUD.playing=true;drawLesson();
    }catch(e){stopRecording();drawLesson();toast(t("aud_fail"))}
  })();
}

async function callGuide(mode,onText){
  const J=JS,tp=J.tp,p=tp.prompts[J.i]||{};

  if(!r.ok){const e=new Error("fn "+r.status);e.status=r.status;throw e}
  const ct=r.headers.get("content-type")||"";
  if(ct.includes("application/json")||!r.body){const o=await r.json();if(!o||!o.reply)throw new Error("empty");const rp=cleanMd(o.reply);onText&&onText(rp);return rp}

    const total=E.steps.reduce((a,b)=>a+(b.secs||0),0);

     <div class="q"><div class="ql">${t("r_name")}</div><input type="text" id="ren" maxlength="20" value="${esc(E.name)}"></div>

      <button class="ib" data-mu="${i}" aria-label="move up" ${i===0?"disabled":""}>↑</button><button class="ib" data-md="${i}" aria-label="move down" ${i===E.steps.length-1?"disabled":""}>↓</button><button class="ib" data-rm="${i}" aria-label="remove">✕</button></div>`});
    h+=`<div class="row" style="margin-top:10px"><button class="btn alt" id="rlib" style="flex:1">${t("r_add_lib")}</button><button class="btn alt" id="rown" style="flex:1">${t("r_add_own")}</button></div>`;

    if(E.own)h+=`<div class="q" style="margin-top:10px"><div class="ql">${t("r_own_name")}</div><div class="row"><input type="text" id="oe" maxlength="4" placeholder="✨" style="flex:0 0 60px;text-align:center"><input type="text" id="on" maxlength="20"></div>
      <div class="ql" style="margin-top:8px">${t("r_own_min")}</div><div class="opts" style="display:grid;gap:8px;grid-template-columns:repeat(5,minmax(0,1fr))">${[1,2,3,5,10].map(m=>`<button class="opt${m===2?" on":""}" data-om="${m}">${m}</button>`).join("")}</div>
      <button class="btn mint" id="oadd" style="margin-top:10px">${t("r_add")}</button></div>`;
    h+=`<button class="btn" id="rsave" style="margin-top:14px">${t("r_save")}</button>${E.slot==="custom"&&E.id?`<button class="btn alt" id="rdel" style="margin-top:10px">${t("r_delete")}</button>`:""}`;
    openSheet(h);const sh=document.getElementById("sheet");

    sh.querySelectorAll("[data-dn]").forEach(b=>b.onclick=()=>{const x=E.steps[+b.dataset.dn];x.secs=Math.max(10,x.secs-step(x.secs-1));draw()});
    sh.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>{const x=E.steps[+b.dataset.up];x.secs=Math.min(3600,x.secs+step(x.secs));draw()});

        E.steps.push({key:"custom",emoji:em||"✨",zh:nm,en:"",secs:om*60,needs_emoji:!em});E.own=false;draw()}}
    sh.querySelector("#rsave").onclick=async()=>{if(!E.steps.length){toast(t("r_empty"));return}const b=sh.querySelector("#rsave");b.disabled=true;
      try{const nid=await rpc("care_routine_save",{p_id:E.id,p_slot:E.slot,p_name_zh:(E.name||t("r_newname")).trim(),p_emoji:E.emoji,p_steps:E.steps});

    const del=sh.querySelector("#rdel");if(del)del.onclick=async()=>{try{await rpc("care_routine_delete",{p_id:E.id});ST.routines=(ST.routines||[]).filter(r=>r.id!==E.id);render();openRoutineList()}catch(e){toast(t("net"))}};
  };
  draw();
}

/* ---------- breathing ---------- */
function isBreathTask(tk){return /^breathe|^wait$/.test(tk.id)||/呼吸/.test(tk.zh||"")&&tk.id!=="rest"}
function breathRounds(tk){if(!tk)return 4;const s=(tk.zh||"")+" "+(tk.en||"");const m=s.match(/(\d+)\s*(轮|rounds?)/i);return m?Math.min(12,Math.max(1,+m[1])):4}
function breathMinutes(tk){return breathRounds(tk)}
function breathNeeded(tk){return tk&&/各一次|两次|twice|morning and evening/.test((tk.zh||"")+(tk.en||""))?2:1}
function breathKey(tk){return "pp_b_"+ST.today+"_"+(tk?tk.id:"x")}
function gentleOn(){try{return localStorage.getItem("pp_gentle")==="1"}catch(e){return false}}
function setGentle(v){try{localStorage.setItem("pp_gentle",v?"1":"0")}catch(e){}}
function openBreathLauncher(tk){
  const rounds=breathRounds(tk),need=breathNeeded(tk);let have=0;try{have=+(localStorage.getItem(breathKey(tk))||0)}catch(e){}
  openSheet(`<h2>🌬️ ${t("b_title")}</h2><p style="color:var(--muted);margin:0 0 12px">${gz(esc(t("b_hint")))}</p>
   ${tk?`<p style="margin:0 0 12px"><strong>${esc(L==="zh"?tk.zh:(tk.en||tk.zh))}</strong>${need>1?` · ${have}/${need}`:""}</p>`:""}
   <div class="ql" style="margin-bottom:8px">${t("b_choose")}</div>
   <div class="opts" style="display:grid;gap:8px;grid-template-columns:repeat(3,minmax(0,1fr))">${[4,6,8].map(m=>`<button class="opt${m===rounds?" on":""}" data-m="${m}">${t("b_r"+m)}</button>`).join("")}</div>
   <label style="display:flex;gap:10px;align-items:center;margin-top:14px;cursor:pointer"><input type="checkbox" id="bgent" ${gentleOn()?"checked":""} style="width:22px;height:22px"><span>${t("b_gentle")}</span></label>
   <button class="btn" id="bgo" style="margin-top:16px">${t("b_start")}</button>${tk?`<button class="btn alt" id="bmark" style="margin-top:10px">${t("b_mark")}</button>`:""}`);
  const sh=document.getElementById("sheet");let pick=rounds;
  sh.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{pick=+b.dataset.m;sh.querySelectorAll("[data-m]").forEach(o=>o.classList.toggle("on",o===b))});
  sh.querySelector("#bgent").onchange=e=>setGentle(e.target.checked);
  sh.querySelector("#bgo").onclick=()=>{closeSheet();startBreath(pick,tk)};
  const mk=sh.querySelector("#bmark");if(mk)mk.onclick=()=>{closeSheet();completeIfPlanned(tk.id)};
}
let wakeLock=null;
async function keepAwake(on){try{if(on&&navigator.wakeLock){wakeLock=await navigator.wakeLock.request("screen")}else if(!on&&wakeLock){await wakeLock.release();wakeLock=null}}catch(e){}}
function startBreath(rounds,tk,onEnd){
  rounds=Math.max(1,Math.min(12,+rounds||4));
  const el=document.getElementById("breath");const IN=4000,OUT=8000;let HOLD=gentleOn()?2000:7000;
  el.innerHTML=`<div style="font-weight:700;color:var(--muted)">${t("b_title")} · 4-${HOLD/1000}-8</div>
    <div class="orb"><div class="orbring" id="bring"></div><div class="pigc">${pigSVG()}</div></div>
    <div class="bphase" id="bph"></div><div class="bcount" id="bct"></div><div class="btime" id="btm"></div><div class="btip" id="btip"></div>
    <div class="brow"><button class="btn alt" id="bpause">${t("b_pause")}</button><button class="btn alt" id="bgentle">${gentleOn()?t("b_full"):t("b_soft")}</button><button class="btn alt" id="bstop">${t("b_stop")}</button></div>`;
  el.classList.add("on");keepAwake(true);
  const ring=el.querySelector("#bring"),ph=el.querySelector("#bph"),ct=el.querySelector("#bct"),tm=el.querySelector("#btm"),tip=el.querySelector("#btip");
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  let round=0,inRound=0,last=performance.now(),paused=false,raf=0,lastPhase="";
  const ease=x=>.5-Math.cos(Math.PI*x)/2;
  const frame=now=>{
    if(!paused)inRound+=now-last;last=now;
    const CYC=IN+HOLD+OUT;if(inRound>=CYC){inRound-=CYC;round++;if(round>=rounds){finish(true);return}}
    const c=inRound;let phase,p,sc,left;
    if(c<IN){phase="in";p=c/IN;sc=.55+.45*ease(p);left=IN-c}
    else if(c<IN+HOLD){phase="hold";sc=1;left=IN+HOLD-c}
    else{phase="out";p=(c-IN-HOLD)/OUT;sc=1-.45*ease(p);left=CYC-c}
    ring.style.transform=`scale(${reduce?(phase==="out"?.7:1):sc})`;
    if(phase!==lastPhase){lastPhase=phase;ph.textContent=t(phase==="in"?"b_in":phase==="hold"?"b_hold":"b_out");tip.textContent=phase==="hold"?t("b_hold_tip"):"";buzz()}
    ct.textContent=String(Math.ceil(left/1000));
    tm.textContent=t("b_round",{i:Math.min(round+1,rounds),n:rounds});
    raf=requestAnimationFrame(frame);
  };
  const finish=done=>{cancelAnimationFrame(raf);keepAwake(false);el.classList.remove("on");
    if(onEnd)setTimeout(()=>onEnd(done),0);
    if(!done)return;
    if(tk){const need=breathNeeded(tk);let have=0;try{have=+(localStorage.getItem(breathKey(tk))||0)+1;localStorage.setItem(breathKey(tk),String(have))}catch(e){have=need}
      if(have>=need){toast(t("b_done"));confetti();hearts(12,["🌬️","🐷","✨"]);completeIfPlanned(tk.id)}else{toast(t("b_once"));hearts(8,["🌬️","⭐"])}}
    else{toast(t("b_done"));hearts(10,["🌬️","🐷","✨"])}
  };
  el.querySelector("#bpause").onclick=e=>{paused=!paused;e.target.textContent=paused?t("b_resume"):t("b_pause")};
  el.querySelector("#bgentle").onclick=e=>{const g=!gentleOn();setGentle(g);HOLD=g?2000:7000;e.target.textContent=g?t("b_full"):t("b_soft");el.querySelector("div").textContent=`${t("b_title")} · 4-${HOLD/1000}-8`};
  el.querySelector("#bstop").onclick=()=>finish(false);
  raf=requestAnimationFrame(frame);
}


/* ---------- important new guides open once by themselves (e.g. new medicines) ---------- */
function maybeAutoLesson(){
  if(!ST||document.querySelector("#lesson.on,#journal.on,#sheet.on,#routine.on,#breath.on"))return false;
  const c=(ST.content||[]).find(x=>x.kind==="lesson"&&x.data&&x.data.auto_open&&x.data.zh&&x.data.zh.cards&&!(ST.lessons_seen||[]).includes(x.data.task_id||x.key)&&!(()=>{try{return localStorage.getItem("pp_auto_"+x.key)==="1"}catch(e){return false}})());
  if(!c)return false;
  try{localStorage.setItem("pp_auto_"+c.key,"1")}catch(e){}
  openLesson({id:c.data.task_id||c.key,emoji:c.data.emoji,zh:c.data.task_zh||"",en:c.data.task_en||""});return true;
}
/* ---------- a gentle, one-time nudge for an unread guide on today's plan ---------- */
function guideIds(ls){return [ls.data.task_id||ls.key].concat(Array.isArray(ls.data.task_ids)?ls.data.task_ids:[])}
function guideSeen(ls){const s=ST.lessons_seen||[];return guideIds(ls).some(id=>s.includes(id))}
function maybeLessonNudge(){
  if(!ST||document.querySelector("#lesson.on,#journal.on,#sheet.on,#routine.on,#breath.on"))return false;
  try{if(localStorage.getItem("pp_nudge_day")===String(ST.today))return false}catch(e){} // at most one nudge a day
  const done=doneSet(ST.today);
  const pri=id=>id==="c_humid_setup"?0:id==="humid"?1:/^meds_/.test(id)?2:/^c_/.test(id)?3:4;
  const cand=todayPlan().filter(tk=>!done.has(tk.id)).map(tk=>({tk,ls:lessonFor(tk)}))
    .filter(x=>x.ls&&x.ls.data&&x.ls.data.zh&&x.ls.data.zh.cards&&!guideSeen(x.ls)&&!(()=>{try{return localStorage.getItem("pp_nudge_"+x.ls.key)==="1"}catch(e){return false}})())
    .sort((a,b)=>pri(a.tk.id)-pri(b.tk.id));
  if(!cand.length)return false;
  const {tk,ls}=cand[0];
  try{localStorage.setItem("pp_nudge_"+ls.key,"1");localStorage.setItem("pp_nudge_day",String(ST.today))}catch(e){} // never this guide again
  openSheet(`<div style="text-align:center"><div style="font-size:2.6rem">${esc(ls.data.emoji||tk.emoji||"📖")}</div><h2 style="justify-content:center">${t("nudge_t")}</h2><p>${t("nudge_b",{task:esc(L==="zh"?tk.zh:(tk.en||tk.zh))})}</p><button class="btn" id="ngo">${t("nudge_go")}</button><button class="btn alt" id="nlater" style="margin-top:8px">${t("nudge_later")}</button></div>`);
  document.getElementById("ngo").onclick=()=>{closeSheet();setTimeout(()=>openLesson(tk),150)};
  document.getElementById("nlater").onclick=closeSheet;
  return true;
}

/* ---------- badges ---------- */
function getSeen(){try{return JSON.parse(localStorage.getItem("pp_seen")||"[]")}catch(e){return []}}
function checkNewBadges(){
  const s=stats(),seen=new Set(getSeen()),fresh=BADGES.filter(b=>b.ok(s)&&!seen.has(b.id));
  if(!fresh.length)return;
  fresh.forEach(b=>seen.add(b.id));try{localStorage.setItem("pp_seen",JSON.stringify([...seen]))}catch(e){}
  if(!checkNewBadges._init){checkNewBadges._init=true;if(s.tasks===0&&s.checkins===0)return}
  const b=fresh[0];setTimeout(()=>{toast(`${b.e} ${t("newbadge")} ${L==="zh"?b.zh:b.en}`);hearts(10,[b.e,"✨","🐷"])},500);
}

/* ---------- as-needed lorazepam: log a dose, see today's count, stay within 3 a day ---------- */
function agoText(ts){const m=Math.max(1,Math.round((Date.now()-new Date(ts).getTime())/60000));return m<60?t("prn_min",{n:m}):t("prn_hr",{n:(m/60).toFixed(m<600?1:0).replace(/\.0$/,"")})}
function prnHTML(){return `<div class="prnbox"><div class="prnh">💊 ${t("prn_title")}</div><div id="prnst" class="prnst">${t("prn_loading")}</div><button class="btn alt" id="prnadd" disabled>${t("prn_add")}</button><div id="prnundo"></div></div>`}
function prnShow(res,justAdded){
  const st=document.getElementById("prnst"),btn=document.getElementById("prnadd"),un=document.getElementById("prnundo");if(!st||!btn)return;
  const n=(res&&res.doses||[]).length,last=res&&res.last;PRN=res;
  st.textContent=n>=3?t("prn_limit"):n?t("prn_count",{n,ago:agoText(res.doses[n-1])}):t("prn_none");
  st.classList.toggle("lim",n>=3);btn.disabled=n>=3;
  if(un)un.innerHTML=justAdded?`<p class="prnok">${t("prn_saved")}</p><button class="linkish" id="prnu">${t("prn_undo")}</button>`:"";
  const u=document.getElementById("prnu");if(u)u.onclick=async()=>{u.disabled=true;try{prnShow(await rpc("care_prn",{p_action:"undo"}),false)}catch(e){toast(t("net"))}};
}
let PRN=null;
function bindPrn(){
  const btn=document.getElementById("prnadd");if(!btn)return;
  rpc("care_prn",{p_action:"list"}).then(r=>prnShow(r,false)).catch(()=>{const st=document.getElementById("prnst");if(st)st.textContent=t("net");btn.disabled=false});
  btn.onclick=async()=>{
    const d=(PRN&&PRN.doses)||[],last=d.length?d[d.length-1]:null;
    if(last&&Date.now()-new Date(last).getTime()<3*3600e3&&!confirm(t("prn_soon",{ago:agoText(last)})))return;
    btn.disabled=true;
    try{const r=await rpc("care_prn",{p_action:"add"});prnShow(r,true);
      const n=(r.doses||[]).length;if(n>=3)ping("💊 Day "+ST.today+": as-needed lorazepam","She has taken her third ¼ tablet today (the daily limit). A gentle check-in might help.",3,"pill")}
    catch(e){if(e.status===400)prnShow(Object.assign({},PRN||{},{doses:[1,2,3]}),false);else{toast(t("net"));btn.disabled=false}}
  };
}

/* ---------- 10-second check-in on tired days ---------- */
const SIDE=["none","sleepy","jittery","nausea","headache","dry","poor_sleep","restless","dizzy"];
function quickCheckinCard(){
  if((ST.checkins||[]).some(c=>c.day===ST.today)||new Date().getHours()<12)return"";
  const F=t("faces");
  return `<div class="card qck" id="qck"><h2>⚡ ${t("qc_title")}</h2><p class="sub2" style="margin:0 0 10px">${t("qc_sub")}</p>
   <div class="ql">${t("ck_mood")}</div><div class="opts" style="display:grid;gap:6px;grid-template-columns:repeat(5,1fr)">${F.map((f,i)=>`<button class="opt" data-qm="${i*2+2}">${f}</button>`).join("")}</div>
   <div class="ql" style="margin-top:10px">${t("ck_panic")}</div><div class="opts" style="display:grid;gap:6px;grid-template-columns:repeat(5,1fr)">${[[0,"0"],[1,"1"],[2,"2"],[3,"3"],[5,"4+"]].map(([v,l])=>`<button class="opt" data-qp="${v}">${l}</button>`).join("")}</div>
   <div class="ql" style="margin-top:10px">${t("qc_side")}</div><div class="chips">${SIDE.map(k=>`<button class="chip" data-qs="${k}">${t("se_"+k)}</button>`).join("")}</div>
   <button class="btn" id="qcsave" disabled style="margin-top:12px">${t("qc_save")}</button><button class="linkish" id="qcfull">${t("qc_full")}</button></div>`;
}
function bindQuickCheckin(){
  const box=document.getElementById("qck");if(!box)return;const V={mood:null,panic:null,side:new Set()};
  const upd=()=>{box.querySelectorAll("[data-qm]").forEach(b=>b.classList.toggle("on",+b.dataset.qm===V.mood));box.querySelectorAll("[data-qp]").forEach(b=>b.classList.toggle("on",+b.dataset.qp===V.panic));box.querySelectorAll("[data-qs]").forEach(b=>b.classList.toggle("on",V.side.has(b.dataset.qs)));box.querySelector("#qcsave").disabled=V.mood==null||V.panic==null};
  box.querySelectorAll("[data-qm]").forEach(b=>b.onclick=()=>{V.mood=+b.dataset.qm;upd()});
  box.querySelectorAll("[data-qp]").forEach(b=>b.onclick=()=>{V.panic=+b.dataset.qp;upd()});
  box.querySelectorAll("[data-qs]").forEach(b=>b.onclick=()=>{const k=b.dataset.qs;if(k==="none"){V.side.clear();V.side.add("none")}else{V.side.delete("none");V.side.has(k)?V.side.delete(k):V.side.add(k)}upd()});
  box.querySelector("#qcfull").onclick=()=>openCheckin();
  box.querySelector("#qcsave").onclick=async()=>{
    const btn=box.querySelector("#qcsave");btn.disabled=true;const side=[...V.side];
    try{await rpc("care_checkin_quick",{p_day:ST.today,p_mood:V.mood,p_panic:V.panic,p_side:side.length?side:null})}catch(e){toast(t("net"));btn.disabled=false;return}
    ST.checkins=(ST.checkins||[]).filter(c=>c.day!==ST.today);ST.checkins.push({day:ST.today,mood:V.mood,panic:V.panic,side_effects:side});
    setLog(ST.today,"checkin",true);toast("📝 "+t("ck_done"));hearts(8,["⭐","🐷","💕"]);
    const se=side.filter(x=>x!=="none").map(x=>W.en["se_"+x]||x).join(", ");
    const hard=V.mood<=3||V.panic>=2;
    if(hard)ping("💛 Day "+ST.today+" quick check-in: a hard day","Mood "+V.mood+"/10, "+V.panic+" panic"+(V.panic===1?"":"s")+(se?". Side effects: "+se:"")+". A gentle check-in from you would mean a lot.",4,"yellow_heart");
    else ping("📝 Day "+ST.today+" quick check-in","Mood "+V.mood+"/10, "+V.panic+" panic"+(V.panic===1?"":"s")+(se?". Side effects: "+se:"")+".",3,"memo");
    if(hard){render();setTimeout(()=>openHardDay(V),350);return}
    afterChange();
  };
}

/* ---------- instant start: show the last saved copy, then refresh quietly ---------- */
function cacheKey(){return "pp_cache_"+String(KEY||"").slice(0,8)}
function saveCache(){try{localStorage.setItem(cacheKey(),JSON.stringify(ST))}catch(e){}}
function readCache(){try{const c=JSON.parse(localStorage.getItem(cacheKey())||"null");return c&&c.today&&Array.isArray(c.days)?c:null}catch(e){return null}}

/* ---------- boot ---------- */
async function load(){
  const app=document.getElementById("app");
  if(!KEY){app.innerHTML=`<div class="center"><div class="pig" style="margin:0 auto 12px;width:96px;height:96px">${pigSVG()}</div>${t("nolink")}</div>`;return}
  if(!ST){const c=readCache();if(c){ST=c;try{applyContent()}catch(e){}document.getElementById("tabs").hidden=false;render()}}
  try{const fresh=await rpc("care_state",{});ST=fresh;try{applyContent()}catch(e){}saveCache()}
  catch(e){if(ST){if(e.status!==403&&e.status!==401)toast(t("offline"));return}app.innerHTML=`<div class="center"><div class="pig" style="margin:0 auto 12px;width:96px;height:96px">${pigSVG("sleepy")}</div>${e.status===403||e.status===401?t("nolink"):t("net")}<br><br><button class="btn alt" id="retry" style="max-width:220px;margin:0 auto">↻</button></div>`;const r=document.getElementById("retry");if(r)r.onclick=load;return}
  document.getElementById("tabs").hidden=false;setTimeout(checkJoelHugs,300);
  try{const seen=getSeen();checkNewBadges._init=seen.length>0}catch(e){}
  render();
}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{TAB=b.dataset.t;render();scrollTo({top:0,behavior:"smooth"})});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&ST)load()});
load();
