<title>小猪加油</title>
<style>
:root{
  --bg:#FFF3F7;--card:#FFFFFF;--ink:#3B2530;--muted:#8E6F7C;--line:#F6D9E3;
  --pink:#FF7FA8;--pink-soft:#FFE1EB;--mint:#3FB59B;--mint-soft:#DDF5EE;--gold:#F5B640;--gold-soft:#FFF1D2;--lilac:#9B87E8;
  --shadow:0 6px 18px rgba(214,99,140,.12);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1E1519;--card:#2A1E24;--ink:#F8E9EF;--muted:#BFA2AE;--line:#3D2C34;
  --pink:#FF8FB3;--pink-soft:#46262F;--mint:#56C9AE;--mint-soft:#1F3A33;--gold:#F7C25A;--gold-soft:#3D3220;--lilac:#B3A3F0;--shadow:none}}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC",system-ui,sans-serif;font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain}
button{font:inherit;color:inherit}
.wrap{max-width:520px;margin:0 auto;padding:12px 16px calc(96px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;gap:14px;padding:8px 0 4px}
.pig{width:68px;height:68px;flex:none;position:relative}
.pig svg{width:100%;height:100%;display:block}
.pig .lv{position:absolute;right:-6px;bottom:-4px;background:var(--gold);color:#3B2530;font-size:.72rem;font-weight:800;border-radius:10px;padding:1px 7px;border:2px solid var(--bg)}
.hello h1{font-size:1.45rem;line-height:1.2;margin:0}
.hello .sub{color:var(--muted);font-size:.9rem}
.lang{all:unset;margin-left:auto;align-self:flex-start;font-size:.8rem;color:var(--muted);border:1px solid var(--line);border-radius:14px;padding:3px 10px;cursor:pointer}
.xp{margin:12px 0 4px;display:flex;align-items:center;gap:10px;font-size:.85rem;color:var(--muted)}
.xpbar{flex:1;height:10px;border-radius:6px;background:var(--pink-soft);overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--gold));border-radius:6px;transition:width .6s cubic-bezier(.2,.9,.3,1.3)}
.chips{display:flex;gap:8px;margin:8px 0 14px;flex-wrap:wrap}
.chip{background:var(--card);border-radius:14px;padding:6px 12px;font-size:.88rem;box-shadow:var(--shadow);border:1px solid var(--line)}
.card{background:var(--card);border-radius:22px;padding:16px;margin:0 0 14px;box-shadow:var(--shadow);border:1px solid var(--line)}
.note{background:linear-gradient(135deg,var(--pink-soft),var(--card))}
.note .from{font-size:.8rem;color:var(--muted);margin-bottom:4px}
.note p{margin:0 0 10px;font-size:1.02rem}
.hug{all:unset;cursor:pointer;background:var(--pink);color:#fff;border-radius:16px;padding:9px 16px;font-weight:700;font-size:.95rem}
.hug:active{transform:scale(.96)}
h2{font-size:1.1rem;margin:4px 0 10px;display:flex;align-items:center;gap:8px}
h2 .count{margin-left:auto;font-size:.9rem;color:var(--muted);font-weight:600}
.ring{width:22px;height:22px}
.task{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:12px 14px;margin:0 0 10px;border-radius:18px;background:var(--bg);border:2px solid transparent;transition:transform .15s,background .25s,border-color .25s;position:relative}
.task:active{transform:scale(.98)}
.task .em{font-size:1.6rem;width:36px;text-align:center;flex:none}
.task .tx{flex:1;font-size:1rem;line-height:1.35}
.task .tx small{display:block;color:var(--muted);font-size:.78rem;margin-top:2px}
.task .ck{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--line);flex:none;display:grid;place-items:center;font-size:1rem;color:#fff;transition:all .25s}
.task.done{background:var(--mint-soft);border-color:var(--mint)}
.task.done .tx{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--mint)}
.task.done .ck{background:var(--mint);border-color:var(--mint)}
.task.pop{animation:pop .45s cubic-bezier(.2,.9,.3,1.5)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.05)}100%{transform:scale(1)}}
.float{position:fixed;pointer-events:none;font-weight:800;color:var(--pink);font-size:1.1rem;animation:up 1s ease-out forwards;z-index:60}
@keyframes up{to{transform:translateY(-60px);opacity:0}}
.tomorrow{text-align:center;color:var(--muted);font-size:.88rem;padding:6px 0 4px}
.treatday{display:flex;align-items:center;gap:12px;background:var(--gold-soft);border-radius:18px;padding:12px 14px}
.treatday .em{font-size:1.8rem}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;text-align:center;background:var(--pink);color:#fff;font-weight:800;border-radius:18px;padding:15px;font-size:1.05rem;min-height:52px}
.btn.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn.mint{background:var(--mint)}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.5}
.survey{background:linear-gradient(135deg,#EDE7FF,var(--card))}
@media (prefers-color-scheme:dark){.survey{background:linear-gradient(135deg,#2E2747,var(--card))}}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:30}
.tabs button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--muted);padding:4px 6px;border-radius:12px;flex:1;min-width:0}
.tabs button .ti{font-size:1.45rem;line-height:1}
.tabs button[aria-selected="true"]{color:var(--pink);font-weight:700}
/* badges */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{background:var(--bg);border-radius:18px;padding:12px 6px;text-align:center;font-size:.78rem;line-height:1.3;border:1.5px solid var(--line)}
.badge .b{font-size:2rem;display:block;margin-bottom:4px}
.badge.locked{opacity:.45;filter:grayscale(1)}
.badge.new{border-color:var(--gold);animation:pop .6s}
.stat{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:.95rem}
.stat:first-of-type{border-top:0}
/* treats */
.tlist{display:flex;flex-direction:column;gap:8px}
.titem{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:var(--bg)}
.titem .em{font-size:1.5rem;width:32px;text-align:center}
.titem .by{margin-left:auto;font-size:.75rem;color:var(--muted)}
.row{display:flex;gap:8px}
input[type=text],textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:12px;width:100%}
textarea{min-height:80px;resize:vertical}
/* sheet + overlay */
.scrim{position:fixed;inset:0;background:rgba(40,15,25,.45);z-index:40;display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--card);border-radius:26px 26px 0 0;z-index:50;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.9,.3,1)}
.sheet.on{transform:none}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.q{margin:0 0 16px}
.q .ql{font-weight:700;margin-bottom:8px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{all:unset;cursor:pointer;min-width:52px;min-height:46px;padding:0 12px;border-radius:14px;background:var(--bg);border:2px solid var(--line);display:grid;place-items:center;font-size:1rem}
.opt.face{font-size:1.6rem}
.opts .opt{min-width:0;padding:0 4px;justify-content:center}
.opt.on{border-color:var(--pink);background:var(--pink-soft);font-weight:700}
.party{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(255,236,243,.92)}
@media (prefers-color-scheme:dark){.party{background:rgba(30,21,25,.94)}}
.party.on{display:flex}
.party .box{max-width:420px;width:100%;text-align:center}
.party .bigpig{width:120px;height:120px;margin:0 auto;animation:bounce 1s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-14px) rotate(3deg)}}
.party h3{font-size:1.5rem;margin:12px 0 4px}
.party .tchoice{display:flex;flex-direction:column;gap:10px;margin:16px 0}
.party .tchoice button{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:14px;border:2px solid var(--line);text-align:left;font-size:1rem}
.party .tchoice button:active{border-color:var(--pink)}
.party .tchoice .em{font-size:1.7rem}
.hearts{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
.heart{position:absolute;bottom:-40px;font-size:1.8rem;animation:rise 2.4s ease-in forwards}
@keyframes rise{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:75}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-140%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:16px;font-size:.92rem;z-index:90;transition:transform .35s;max-width:90vw;text-align:center}
.toast.on{transform:translate(-50%,0)}
.center{text-align:center;color:var(--muted);padding:40px 10px}
.help{background:var(--gold-soft);border-radius:16px;padding:12px;margin:12px 0;font-size:.95rem}
.prog{height:6px;border-radius:3px;background:var(--pink-soft);margin:6px 0 14px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--lilac);transition:width .3s}

/* routines */
.rt{position:fixed;inset:0;z-index:84;background:linear-gradient(180deg,var(--pink-soft),var(--bg) 55%);display:none;flex-direction:column;padding:calc(14px + env(safe-area-inset-top,0px)) 20px calc(18px + env(safe-area-inset-bottom,0px))}
.rt.on{display:flex}
.rt .rhead{display:flex;align-items:center;gap:10px;font-weight:800}
.rt .rhead .x{all:unset;cursor:pointer;margin-left:auto;font-size:1.3rem;padding:6px 10px;border-radius:12px}
.rt .segs{display:flex;gap:4px;margin:12px 0 4px}
.rt .segs i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.rt .segs i.d{background:var(--mint)}.rt .segs i.c{background:var(--pink)}
.rt .rmain{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
.rt .dial{position:relative;width:min(64vw,250px);height:min(64vw,250px)}
.rt .dial svg{width:100%;height:100%;transform:rotate(-90deg)}
.rt .dial .em{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(4rem,22vw,6.2rem)}
.rt .dial.pulse .em{animation:pop .5s}
.rt .sname{font-size:1.45rem;font-weight:800;line-height:1.3;max-width:340px}
.rt .stime{font-size:2.1rem;font-weight:800;font-variant-numeric:tabular-nums}
.rt .stime.over{color:var(--muted);font-size:1.4rem}
.rt .next{font-size:.85rem;color:var(--muted);margin-top:4px}
.rt .ctrl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.rt .ctrl .btn{padding:12px 6px;font-size:.95rem;min-height:48px}
.star{display:inline-block;background:var(--gold-soft);color:var(--ink);border-radius:12px;padding:2px 10px;font-size:.8rem;font-weight:700}
.rcard{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:var(--bg);margin:0 0 10px;border:1.5px solid var(--line)}
.rcard .em{font-size:2rem}
.rcard .meta{flex:1;min-width:0}
.rcard .meta small{display:block;color:var(--muted);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcard .go{all:unset;cursor:pointer;background:var(--pink);color:#fff;font-weight:800;border-radius:14px;padding:10px 14px}
.rcard .ed{all:unset;cursor:pointer;padding:10px;font-size:1.1rem}
.srow{display:flex;align-items:center;gap:6px;padding:8px 0;border-top:1px solid var(--line)}
.srow .em{font-size:1.4rem;width:30px;text-align:center}
.srow .nm{flex:1;min-width:0;font-size:.95rem}

.emopick{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.emopick button{all:unset;cursor:pointer;font-size:1.5rem;padding:4px 8px;border-radius:10px;border:2px solid transparent}
.emopick button.on{border-color:var(--pink);background:var(--pink-soft)}

.dream{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;padding:14px;border-radius:18px;background:var(--bg);margin:0 0 10px;border:1.5px solid var(--line)}

.dream .dh{font-weight:700;margin:2px 0}
.dream .dp{color:var(--muted);font-size:.92rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pill2{display:inline-block;font-size:.74rem;border-radius:10px;padding:2px 8px;background:var(--pink-soft);margin:6px 6px 0 0}
.pill2.ok{background:var(--mint-soft)}
.tool.nightsky,.nightsky{background:linear-gradient(160deg,#2B2346,#4B3A78 60%,#7A5BA8);color:#F6F0FF;border:0}
.nightsky .sub2{color:#D9CCF5}
.chipsel{display:flex;flex-wrap:wrap;gap:8px}
.chipsel .opt{min-height:40px;padding:0 12px}
.an h3{font-size:1rem;margin:16px 0 6px}
.an p{margin:0 0 8px}
.an .sym{background:var(--bg);border-radius:14px;padding:10px 12px;margin:0 0 8px}

.breath{position:fixed;inset:0;z-index:85;background:radial-gradient(circle at 50% 40%,var(--pink-soft),var(--bg) 70%);display:none;flex-direction:column;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));text-align:center}
.breath.on{display:flex}
.orb{width:min(72vw,300px);height:min(72vw,300px);border-radius:50%;display:grid;place-items:center;position:relative;margin:18px 0}
.orb .orbring{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle,#FFC2D6 0%,var(--pink) 70%);box-shadow:0 0 60px rgba(255,127,168,.45);transform:scale(.55);will-change:transform}
.orb .pigc{position:relative;width:40%;height:40%;background:#fff;border-radius:50%;padding:5%;box-shadow:0 4px 18px rgba(214,99,140,.25)}
.bphase{font-size:1.7rem;font-weight:800;min-height:2.4rem}
.bcount{font-size:1rem;color:var(--muted);min-height:1.5rem}
.btime{font-variant-numeric:tabular-nums;font-size:1.05rem;color:var(--muted);margin-top:6px}
.brow{display:flex;gap:10px;width:100%;max-width:360px;margin-top:22px}
.brow .btn{flex:1}

.tool{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:14px;width:100%;padding:16px;border-radius:20px;background:var(--bg);margin:0 0 10px;border:1.5px solid var(--line)}
.tool .em{font-size:2rem;width:44px;text-align:center}
.tool b{display:block;font-size:1.05rem}
.tool small{color:var(--muted);font-size:.85rem}
.tool:active{transform:scale(.98)}
.steps li{margin:0 0 10px}
.big-time{font-size:3rem;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;margin:10px 0}
.msgbtn{all:unset;cursor:pointer;margin-left:8px;border:1.5px solid var(--pink);color:var(--pink);border-radius:16px;padding:8px 14px;font-weight:700;font-size:.95rem}
.tabs button .dot{position:absolute;top:2px;right:16px;width:9px;height:9px;border-radius:50%;background:var(--pink)}
.tabs button{position:relative}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- api ---------- */
async function rpc(fn,args){
  const body=JSON.stringify(Object.assign({p_key:KEY},args||{}));
  const url=SB_URL+"/rest/v1/rpc/"+fn;
  let r=await fetch(url,{method:"POST",headers:{"apikey":SB_KEY,"Content-Type":"application/json"},body});
  if(r.status===401){r=await fetch(url,{method:"POST",headers:{"apikey":SB_LEGACY,"Authorization":"Bearer "+SB_LEGACY,"Content-Type":"application/json"},body})}
  if(!r.ok){const e=new Error("rpc "+r.status);e.status=r.status;throw e}
  const txt=await r.text();return txt?JSON.parse(txt):null;
}
async function ping(title,msg,priority,tags){
  try{await fetch(NTFY_URL+"?title="+encodeURIComponent(title)+"&priority="+(priority||3)+"&tags="+encodeURIComponent(tags||"pig"),{method:"POST",body:msg})}catch(e){}
}

/* ---------- state ---------- */
let ST=null,TAB="today";
function todayPlan(){const d=(ST.days||[]).find(x=>x.day===ST.today);return (d&&Array.isArray(d.tasks)&&d.tasks.length)?d.tasks:defaultTasks()}
function todayNote(){const d=(ST.days||[]).find(x=>x.day===ST.today);return d?{zh:d.msg_zh,en:d.msg_en}:null}
function doneSet(day){const s=new Set();(ST.task_log||[]).forEach(r=>{if(r.day===day&&r.done)s.add(r.task_id)});return s}
function planFor(day){const d=(ST.days||[]).find(x=>x.day===day);return (d&&Array.isArray(d.tasks)&&d.tasks.length)?d.tasks:defaultTasks()}
function stats(){
  const s={tasks:0,fullDays:0,checkins:(ST.checkins||[]).length,surveys:(ST.scores_done||[]).filter(c=>CPS.some(x=>x.id===c)).length,
    did:{},calm:0,goodSleep:0,ideas:(ST.treats||[]).filter(x=>x.added_by==="her").length,breath:0,walks:0,treats:(ST.treat_log||[]).length,best:0,cur:0,activeDays:0,today:ST.today};
  (ST.checkins||[]).forEach(c=>{if(c.panic===0)s.calm++;if(c.sleep!=null&&+c.sleep>=7)s.goodSleep++});
  const active=[];
  for(let d=1;d<=ST.today;d++){
    const plan=planFor(d),done=doneSet(d);let n=0;
    plan.forEach(tk=>{if(done.has(tk.id)){n++;s.tasks++;s.did[tk.id.replace(/\d+$/,"")]=true;if(/^breathe/.test(tk.id))s.breath++;if(/^walk/.test(tk.id))s.walks++}});
    if(n>0)s.activeDays++;
    if(plan.length&&n===plan.length)s.fullDays++;
    active.push(n>0);
  }
  let run=0;active.forEach(a=>{run=a?run+1:0;if(run>s.best)s.best=run});
  let cur=0;for(let i=active.length-1;i>=0;i--){if(active[i])cur++;else if(i===active.length-1)continue;else break}
  s.cur=cur;
  s.dreams=(ST.dreams||[]).length;s.routines=(ST.routine_runs||[]).filter(r=>r.done>0).length;
  s.xp=s.tasks*10+s.checkins*10+s.fullDays*30+s.surveys*20+s.dreams*10+s.routines*15;
  s.level=Math.floor(s.xp/100)+1;s.inLevel=s.xp%100;
  return s;
}

async function onTask(b,ev){
  const id=b.dataset.id;
  if(id==="checkin"&&!b.classList.contains("done")){openCheckin();return}
  const tk=todayPlan().find(x=>x.id===id);
  if(tk&&isBreathTask(tk)&&!b.classList.contains("done")){openBreathLauncher(tk);return}

  if(tk&&id==="worry"&&!b.classList.contains("done")){openTool("worry");return}
  const was=b.classList.contains("done"),now=!was;
  // optimistic
  setLog(ST.today,id,now);b.classList.toggle("done",now);b.classList.add("pop");b.querySelector(".ck").textContent=now?"✓":"";b.setAttribute("aria-pressed",String(now));
  if(now){buzz();floatXP(ev.clientX||innerWidth/2,ev.clientY||innerHeight/2,"+10 XP ⭐")}
  try{await rpc("care_set_task",{p_day:ST.today,p_task:id,p_done:now})}catch(e){setLog(ST.today,id,was);toast(t("net"));render();return}

/* ---------- survey ---------- */
function startSurvey(cp){
  if(!cp)return;
  const Qs=[];if(cp.t==="full"){GAD.zh.forEach((_,i)=>Qs.push({g:"gad",i,o:OPT4}));PHQ.zh.forEach((_,i)=>Qs.push({g:"phq",i,o:OPT4}))}
  ENS.zh.forEach((_,i)=>Qs.push({g:"ens",i,o:OPT6}));
  const A=new Array(Qs.length).fill(null);let step=-1;
  const sh=document.getElementById("sheet");
  const draw=()=>{
    if(step===-1){openSheet(`<h2>📊 ${t("survey_t")}</h2><p>${t("survey_s",{m:cp.t==="full"?5:1})}</p><div class="help">${t("priv")}</div><button class="btn" id="sgo">${t("survey_go")}</button>`);sh.querySelector("#sgo").onclick=()=>{step=0;draw()};return}
    if(step<Qs.length){const q=Qs[step],src=q.g==="gad"?GAD:q.g==="phq"?PHQ:ENS;
      openSheet(`<div style="font-size:.85rem;color:var(--muted)">${t("qof",{a:step+1,b:Qs.length})}</div><div class="prog"><i style="width:${Math.round(step/Qs.length*100)}%"></i></div>
       <div style="font-size:.9rem;color:var(--muted)">${STEM[q.g][L]}</div><p style="font-size:1.15rem;font-weight:700;margin:6px 0 14px">${src[L][q.i]}</p>
       <div style="display:flex;flex-direction:column;gap:8px">${q.o[L].map((o,v)=>`<button class="opt${A[step]===v?" on":""}" data-v="${v}" style="width:100%;justify-content:flex-start;padding:12px 14px;display:block;text-align:left">${o}</button>`).join("")}</div>
       ${step>0?`<button class="btn alt" id="sback" style="margin-top:14px">${t("back")}</button>`:""}`);
      sh.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{A[step]=+b.dataset.v;buzz();step++;draw()});
      const bk=sh.querySelector("#sback");if(bk)bk.onclick=()=>{step--;draw()};return}
    openSheet(`<h2>✨</h2><button class="btn" id="ssub">${t("submit")}</button><button class="btn alt" id="sback" style="margin-top:10px">${t("back")}</button>`);
    sh.querySelector("#sback").onclick=()=>{step--;draw()};
    sh.querySelector("#ssub").onclick=async()=>{
      const b=sh.querySelector("#ssub");b.disabled=true;
      const s={gad:0,phq:0,ens:0};Qs.forEach((q,k)=>s[q.g]+=A[k]||0);
      const k9=Qs.findIndex(q=>q.g==="phq"&&q.i===8),flag=k9>=0&&A[k9]>0;
      try{await rpc("care_submit_scores",{p_cp:cp.id,p_set:cp.t,p_gad:cp.t==="full"?s.gad:null,p_phq:cp.t==="full"?s.phq:null,p_ens:s.ens})}catch(e){toast(t("net"));b.disabled=false;return}
      ping("📊 Check-in "+cp.id,"New check-in received. Scores are in your console.",3,"bar_chart");
      if(flag)ping("Please check in with her today","She may be having a hard time. Reach out kindly today. (Her answers are private.)",5,"heart");
      (ST.scores_done=ST.scores_done||[]).push(cp.id);
      openSheet(`<h2>${t("thanks")}</h2>${flag?`<div class="help">${t("helpline")}</div>`:""}<button class="btn" id="sdone">${t("close")}</button>`);
      sh.querySelector("#sdone").onclick=()=>{closeSheet();render()};confetti();
    };
  };
  draw();
}

 nose_gel:t=>t.id==="nose"||(/鼻/.test(t.zh||"")&&/(洗|凝胶|护理)/.test(t.zh||"")),humidifier:t=>t.id==="humid",thought:t=>t.id==="thought",wind_down:t=>t.id==="wind",
 eye_drops:t=>/眼药水/.test(t.zh||""),tcm:t=>/中药/.test(t.zh||""),checkin:t=>t.id==="checkin"};
const WEAVE={morning:["sunlight","meds","breathing","dream_log"],evening:["humidifier","breathing","thought","wind_down"]};
let SOUND=true;try{SOUND=localStorage.getItem("pp_sound")!=="0"}catch(e){}
let AC=null;
function tone(freqs,dur){if(!SOUND)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();
  let t0=AC.currentTime;freqs.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type="sine";o.frequency.value=f;o.connect(g);g.connect(AC.destination);
  const st=t0+i*(dur||.16);g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(.18,st+.02);g.gain.exponentialRampToValueAtTime(.001,st+(dur||.16)*1.6);o.start(st);o.stop(st+(dur||.16)*1.7)})}catch(e){}}
const chimeStart=()=>tone([660,880],.14),chimeUp=()=>tone([880,660,880],.18),chimeDone=()=>tone([523,659,784,1047],.13),tick=()=>tone([1200],.05);
function fmtSecs(n){n=Math.max(0,Math.round(n));return Math.floor(n/60)+":"+String(n%60).padStart(2,"0")}
function fmtLen(secs){return secs<120&&secs%60?t("r_sec",{n:secs}):t("r_min",{n:Math.round(secs/60*10)/10})}
function stepTask(st){const f=LINK[st.key];if(!f)return null;return todayPlan().find(tk=>f(tk))||null}
function needOf(tk){return /各一次|两次|早晚|twice|morning and night/i.test((tk.zh||"")+(tk.en||""))?2:1}
function bumpTask(tk){if(!tk||doneSet(ST.today).has(tk.id))return;const k="pp_c_"+ST.today+"_"+tk.id;let n=0;try{n=+(localStorage.getItem(k)||0)+1;localStorage.setItem(k,String(n))}catch(e){n=99}
  if(n>=needOf(tk))completeIfPlanned(tk.id);else toast("⭐ "+(L==="zh"?"今天第1次完成，晚上再来一次就能打勾":"First one today. Once more later to tick it off"))}
function runsToday(id){return (ST.routine_runs||[]).some(r=>r.routine_id===id&&r.day===ST.today&&r.done>0)}
function routineQuick(){
  const rs=(ST.routines||[]).filter(r=>r.slot!=="custom");if(!rs.length)return"";const hr=new Date().getHours();
  const order=hr>=16?rs.slice().sort((a,b)=>(a.slot==="evening"?-1:1)):rs;
  return `<div class="card"><h2>${t("r_quick")}</h2>${order.map(r=>`<div class="rcard"><span class="em">${esc(r.emoji||"🔁")}</span><div class="meta"><b>${esc(L==="zh"?r.name_zh:(r.name_en||r.name_zh))}</b><small>${runsToday(r.id)?t("r_done_today"):(r.steps||[]).map(x=>x.emoji||"✨").join(" ")}</small></div><button class="go" data-rstart="${r.id}">▶ ${t("r_start")}</button></div>`).join("")}</div>`;
}
let RUN=null;
function buildRun(r){
  const steps=(r.steps||[]).map(x=>Object.assign({},x));
  const plan=todayPlan(),done=doneSet(ST.today);
  (WEAVE[r.slot]||[]).forEach(key=>{
    if(steps.some(x=>x.key===key))return;
    if(key==="dream_log"){if(!(ST.dreams||[]).some(d=>d.day===ST.today))steps.push(Object.assign({},RLIBM.dream_log,{optional:true}));return}
    const f=LINK[key];const tk=plan.find(x=>f&&f(x)&&!done.has(x.id));if(!tk)return;
    const st=Object.assign({},RLIBM[key],{today:true});if(key==="breathing")st.secs=breathMinutes(tk)*60;
    const end=steps.findIndex(x=>x.key==="checkin"||x.key==="lights_out");if(end>=0)steps.splice(end,0,st);else steps.push(st);
  });
  steps.forEach(x=>{const tk=stepTask(x);if(tk&&!doneSet(ST.today).has(tk.id))x.today=true});
  return {r,steps,i:0,left:steps.length?steps[0].secs:0,paused:false,doneN:0,t0:Date.now(),iv:null,lastTick:0,hidden:false};
}
function startRoutine(id){
  const r=(ST.routines||[]).find(x=>x.id===id);if(!r||!(r.steps||[]).length)return;
  closeSheet();RUN=buildRun(r);keepAwake(true);document.getElementById("routine").classList.add("on");chimeStart();drawRun();
  RUN.iv=setInterval(()=>{if(!RUN||RUN.paused||RUN.hidden)return;RUN.left-=1;
    if(RUN.left===3||RUN.left===2||RUN.left===1)tick();if(RUN.left===0){chimeUp();buzz()}drawRun(true)},1000);
}
function drawRun(timerOnly){
  const el=document.getElementById("routine"),R=RUN;if(!R)return;const st=R.steps[R.i];if(!st)return;
  const total=Math.max(1,st.secs),frac=R.left>0?R.left/total:0,C=2*Math.PI*46;
  if(timerOnly&&el.querySelector("#rtime")){const tm=el.querySelector("#rtime");tm.textContent=R.left>=0?fmtSecs(R.left):"+"+fmtSecs(-R.left);tm.classList.toggle("over",R.left<0);
    el.querySelector("#rarc").style.strokeDashoffset=String(C*(1-frac));const hint=el.querySelector("#rhint");if(hint)hint.textContent=R.left<=0?t("r_timeup"):"";return}
  const nm=x=>esc(L==="zh"?x.zh:(x.en||x.zh)),nx=R.steps[R.i+1];
  const special=st.key==="breathing"?t("r_breath"):st.key==="checkin"?t("r_ck"):st.key==="dream_log"?t("r_dream"):null;
  el.innerHTML=`<div class="rhead"><span style="font-size:1.4rem">${esc(R.r.emoji||"🔁")}</span><span>${esc(L==="zh"?R.r.name_zh:(R.r.name_en||R.r.name_zh))}</span><span style="color:var(--muted);font-weight:600">${R.i+1}/${R.steps.length}</span>
     <button class="x" id="rsnd" aria-label="sound">${SOUND?t("r_sound_on"):t("r_sound_off")}</button><button class="x" id="rclose" aria-label="close" style="margin-left:0">✕</button></div>
   <div class="segs">${R.steps.map((x,k)=>`<i class="${k<R.i?"d":k===R.i?"c":""}"></i>`).join("")}</div>
   <div class="rmain"><div class="dial pulse"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="var(--line)" stroke-width="6"/><circle id="rarc" cx="50" cy="50" r="46" fill="none" stroke="var(--pink)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-frac)}" style="transition:stroke-dashoffset 1s linear"/></svg><span class="em">${esc(st.emoji||"✨")}</span></div>
     ${st.today?`<span class="star">${t("r_today")}</span>`:st.optional?`<span class="star" style="background:var(--lilac);color:#fff">${t("r_optional")}</span>`:""}
     <div class="sname">${nm(st)}</div><div class="stime" id="rtime">${fmtSecs(R.left)}</div><div class="next" id="rhint"></div>
     <div class="next">${nx?t("r_next")+(nx.emoji||"✨")+" "+nm(nx):t("r_last")}</div></div>
   ${special?`<button class="btn" id="rspecial">${special}</button><button class="btn alt" id="rdone" style="margin-top:8px">${t("r_doneb")}</button>`:`<button class="btn mint" id="rdone">${t("r_doneb")}</button>`}
   <div class="ctrl"><button class="btn alt" id="rpause">${R.paused?t("r_resume"):t("r_pause")}</button><button class="btn alt" id="rplus">${t("r_plus")}</button><button class="btn alt" id="rskip">${t("r_skip")}</button></div>`;
  const q=id=>el.querySelector("#"+id);
  q("rdone").onclick=()=>stepDone(true);q("rskip").onclick=()=>stepDone(false);
  q("rpause").onclick=()=>{R.paused=!R.paused;drawRun()};q("rplus").onclick=()=>{R.left=Math.max(R.left,0)+60;st.secs=Math.max(st.secs,R.left);drawRun()};
  q("rsnd").onclick=()=>{SOUND=!SOUND;try{localStorage.setItem("pp_sound",SOUND?"1":"0")}catch(e){};if(SOUND)chimeStart();drawRun()};
  q("rclose").onclick=quitRoutine;
  const sp=q("rspecial");if(sp)sp.onclick=()=>{
    if(st.key==="breathing"){R.hidden=true;el.classList.remove("on");const tk=stepTask(st);startBreath(Math.max(1,Math.round(st.secs/60)),tk,done=>{R.hidden=false;el.classList.add("on");if(done)stepDone(true,true);else drawRun()})}
    else if(st.key==="checkin"){R.hidden=true;el.classList.remove("on");openCheckin(()=>{R.hidden=false;el.classList.add("on");stepDone(true,true)})}
    else if(st.key==="dream_log"){R.hidden=true;el.classList.remove("on");openDreamLog(()=>{R.hidden=false;el.classList.add("on");stepDone(true,true)})}};
}
function routineSheetClosed(){if(RUN&&RUN.hidden&&!document.getElementById("breath").classList.contains("on")){RUN.hidden=false;CK_CB=null;DL_CB=null;document.getElementById("routine").classList.add("on");drawRun()}}
function stepDone(did,handled){
  const R=RUN;if(!R)return;const st=R.steps[R.i];
  if(did){R.doneN++;buzz();if(!handled){const tk=stepTask(st);if(tk){if(st.key==="breathing"){let have=0;try{have=+(localStorage.getItem(breathKey(tk))||0)+1;localStorage.setItem(breathKey(tk),String(have))}catch(e){have=9}if(have>=breathNeeded(tk))completeIfPlanned(tk.id);else toast(t("b_once"))}else bumpTask(tk)}}
    if(!handled&&st.key==="checkin"){R.hidden=true;document.getElementById("routine").classList.remove("on");openCheckin(()=>{R.hidden=false;document.getElementById("routine").classList.add("on");advance()});return}}
  advance();
}
function advance(){const R=RUN;R.i++;if(R.i>=R.steps.length)return finishRoutine();R.left=R.steps[R.i].secs;R.paused=false;chimeStart();drawRun()}
function quitRoutine(){
  const el=document.getElementById("routine"),R=RUN;R.paused=true;
  el.innerHTML=`<div class="rmain"><div class="bigpig" style="width:110px;height:110px">${pigSVG()}</div><h2 style="justify-content:center">${t("r_quit")}</h2>
    <button class="btn" id="qno" style="max-width:320px">${t("r_quit_no")}</button><button class="btn alt" id="qyes" style="max-width:320px;margin-top:10px">${t("r_quit_yes")}</button></div>`;
  el.querySelector("#qno").onclick=()=>{R.paused=false;drawRun()};
  el.querySelector("#qyes").onclick=()=>{RUN=null;clearInterval(R.iv);keepAwake(false);el.classList.remove("on");
    if(R.doneN>0)rpc("care_routine_done",{p_id:R.r.id,p_done:R.doneN,p_total:R.steps.length,p_seconds:Math.round((Date.now()-R.t0)/1000)}).then(()=>{(ST.routine_runs=ST.routine_runs||[]).push({routine_id:R.r.id,day:ST.today,done:R.doneN,total:R.steps.length});render()}).catch(()=>{});
    render()};
}
function finishRoutine(){
  const R=RUN;RUN=null;clearInterval(R.iv);keepAwake(false);document.getElementById("routine").classList.remove("on");
  const secs=Math.round((Date.now()-R.t0)/1000);chimeDone();confetti();hearts(16,["⭐","🐷","✨",R.r.emoji||"🔁"]);
  rpc("care_routine_done",{p_id:R.r.id,p_done:R.doneN,p_total:R.steps.length,p_seconds:secs}).then(()=>{(ST.routine_runs=ST.routine_runs||[]).push({routine_id:R.r.id,day:ST.today,done:R.doneN,total:R.steps.length});render()}).catch(()=>{});
  const p=document.getElementById("party");
  p.innerHTML=`<div class="box"><div class="bigpig">${pigSVG()}</div><h3>${esc(R.r.emoji||"")} ${t("r_finish")}</h3><p style="margin:0;color:var(--muted)">${t("r_finish_sub",{n:R.doneN,m:Math.max(1,Math.round(secs/60))})}</p><p style="font-weight:800;color:var(--pink);font-size:1.2rem">+15 XP ⭐</p><button class="btn" id="rok" style="margin-top:12px">${t("close")}</button></div>`;
  p.classList.add("on");document.getElementById("rok").onclick=()=>{p.classList.remove("on");afterChange()};
}

/* routine list + editor */
function openRoutineList(){
  const rs=ST.routines||[];
  openSheet(`<h2>🔁 ${t("r_title")}</h2><p style="color:var(--muted);margin:0 0 12px;font-size:.9rem">${t("r_sub")}</p>`+
   rs.map(r=>{const secs=(r.steps||[]).reduce((a,b)=>a+(b.secs||0),0);return `<div class="rcard"><span class="em">${esc(r.emoji||"🔁")}</span><div class="meta"><b>${esc(L==="zh"?r.name_zh:(r.name_en||r.name_zh))}</b><small>${(r.steps||[]).length} · ${fmtLen(secs)} · ${(r.steps||[]).map(x=>x.emoji||"✨").join("")}</small></div><button class="ed" data-redit="${r.id}" aria-label="${t("r_edit")}">✏️</button><button class="go" data-rstart="${r.id}">▶</button></div>`}).join("")+

    const total=E.steps.reduce((a,b)=>a+(b.secs||0),0);

    h+=`<div class="row" style="margin-top:10px"><button class="btn alt" id="rlib" style="flex:1">${t("r_add_lib")}</button><button class="btn alt" id="rown" style="flex:1">${t("r_add_own")}</button></div>`;
    if(E.lib)h+=`<div class="libgrid">${RLIB.map(r=>`<button data-lib="${r[0]}"><span class="e">${r[1]}</span>${esc(L==="zh"?r[2]:r[3])}</button>`).join("")}</div>`;

      <div class="ql" style="margin-top:8px">${t("r_own_min")}</div><div class="opts" style="display:grid;gap:8px;grid-template-columns:repeat(5,minmax(0,1fr))">${[1,2,3,5,10].map(m=>`<button class="opt${m===2?" on":""}" data-om="${m}">${m}</button>`).join("")}</div>

  };
  draw();

    <input type="text" id="dtitle" maxlength="60" placeholder="${esc(t("d_title_ph"))}" style="margin-top:10px">
    <div class="q" style="margin-top:14px"><div class="ql">${t("d_feel")}</div><div class="chipsel">${F.map(f=>`<button class="opt" data-f="${esc(f)}">${esc(f)}</button>`).join("")}</div></div>
    <div class="q"><div class="ql">${t("d_vivid")}</div><div class="opts" style="display:grid;gap:8px;grid-template-columns:repeat(5,minmax(0,1fr))">${["☁️","🌫️","🌙","⭐","✨"].map((e,i)=>`<button class="opt face${i===2?" on":""}" data-v="${i+1}">${e}</button>`).join("")}</div></div>
    <div class="chipsel" style="margin-bottom:14px"><button class="opt" id="dnight">${t("d_night")}</button><button class="opt" id="dlucid">${t("d_lucid")}</button></div>
    <button class="btn" id="dsave">${t("d_save")}</button>`);
  const sh=document.getElementById("sheet");
  sh.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{const f=b.dataset.f;sel.has(f)?sel.delete(f):sel.add(f);b.classList.toggle("on",sel.has(f));buzz()});
  sh.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{vivid=+b.dataset.v;sh.querySelectorAll("[data-v]").forEach(o=>o.classList.toggle("on",o===b));buzz()});
  sh.querySelector("#dnight").onclick=e=>{night=!night;e.currentTarget.classList.toggle("on",night)};
  sh.querySelector("#dlucid").onclick=e=>{lucid=!lucid;e.currentTarget.classList.toggle("on",lucid)};
  sh.querySelector("#dsave").onclick=async()=>{
    const body=sh.querySelector("#dbody").value.trim();if(!body){sh.querySelector("#dbody").focus();return}
    const b=sh.querySelector("#dsave");b.disabled=true;const title=sh.querySelector("#dtitle").value.trim();
    let id;try{id=await rpc("care_dream_add",{p_title:title||null,p_body:body,p_feelings:[...sel],p_vivid:vivid,p_nightmare:night,p_lucid:lucid})}catch(e){toast(t("net"));b.disabled=false;return}
    (ST.dreams=ST.dreams||[]).unshift({id,at:new Date().toISOString(),day:ST.today,title:title||null,body,feelings:[...sel],vivid,nightmare:night,lucid,status:"pending",analysis:null});
    ping("🌙 She logged a dream",(night?"A nightmare. ":"")+"Open your console to create her dream reading.",night?4:3,"crescent_moon");
    closeSheet();toast(t("d_saved"));hearts(12,["🌙","⭐","✨","🐷"]);floatXP(innerWidth/2,innerHeight/2,"+10 XP 🌙");render();
    if(DL_CB){const cb=DL_CB;DL_CB=null;cb(true)}
  };
}
function openDream(id){
  const d=(ST.dreams||[]).find(x=>x.id===id);if(!d)return;const a=d.analysis&&(d.analysis[L]||d.analysis.zh);
  let h=`<h2>${d.nightmare?"😱":d.lucid?"💡":"🌙"} ${esc(d.title||(a&&a.title)||t("d_yours"))}</h2><div class="an">
    <details${a?"":" open"}><summary style="cursor:pointer;color:var(--muted)">${t("d_yours")}</summary><p style="white-space:pre-wrap;margin-top:8px">${esc(d.body)}</p></details>`;
  if(!a)h+=`<p style="margin-top:14px">${t("d_pending")}</p>`;
  else{
    if(a.summary)h+=`<h3>✨ ${t("d_sum")}</h3><p>${esc(a.summary)}</p>`;
    if(Array.isArray(a.symbols)&&a.symbols.length)h+=`<h3>🔮 ${t("d_sym")}</h3>`+a.symbols.map(x=>`<div class="sym"><strong>${esc(x.name)}</strong><p style="margin:4px 0 0">${esc(x.meaning)}</p></div>`).join("");
    if(a.emotions)h+=`<h3>💗 ${t("d_emo")}</h3><p>${esc(a.emotions)}</p>`;
    if(a.waking_life)h+=`<h3>🌤️ ${t("d_wake")}</h3><p>${esc(a.waking_life)}</p>`;
    if(a.patterns)h+=`<h3>🌌 ${t("d_pat")}</h3><p>${esc(a.patterns)}</p>`;
    if(Array.isArray(a.questions)&&a.questions.length)h+=`<h3>🤔 ${t("d_q")}</h3>`+a.questions.map(q=>`<p>• ${esc(q)}</p>`).join("");
    if(a.rescript)h+=`<h3>🖍️ ${t("d_rescript")}</h3><p>${esc(a.rescript)}</p>`;
    if(a.suggestion)h+=`<h3>🐷 ${t("d_sug")}</h3><p>${esc(a.suggestion)}</p>`;
  }
  openSheet(h+`</div><button class="btn alt" id="dclose" style="margin-top:12px">${t("close")}</button>`);
  document.getElementById("dclose").onclick=closeSheet;
}

/* ---------- tools ---------- */
function viewTools(){
  const s=stats();
  const T=[["routines","🔁",t("r_title"),t("r_sub")],["breath","🌬️",t("t_breath"),t("t_breath_s")],["sos","🆘",t("t_sos"),t("t_sos_s")],["thought","✍️",t("t_thought"),t("t_thought_s")],["worry","⏳",t("t_worry"),t("t_worry_s")],["hug","🫂",t("t_hug"),t("t_hug_s")],["msg","💌",t("t_msg"),t("t_msg_s")]];
  return header(s)+`<div class="card"><h2>🧰 ${t("t_title")}</h2><p style="margin:0 0 12px;color:var(--muted);font-size:.92rem">${t("t_sub")}</p>`+
    T.map(([k,e,n,d])=>`<button class="tool" data-tool="${k}"><span class="em">${e}</span><span><b>${n}</b><small>${d}</small></span></button>`).join("")+`</div>`;
}
function openTool(k){
  if(k==="breath")return openBreathLauncher(null);
  if(k==="msg")return openMessage();
  if(k==="hug")return sendHug();
  if(k==="dreamlog")return openDreamLog();
  if(k==="routines")return openRoutineList();
  if(k==="sos"){openSheet(`<h2>🆘 ${t("t_sos")}</h2><ol class="steps">${t("sos_steps").map(x=>`<li>${x}</li>`).join("")}</ol>
     <button class="btn" id="sosb">${t("sos_breathe")}</button><button class="btn alt" id="sosm" style="margin-top:10px">${t("msg_btn")}</button><div class="help">${t("sos_help")}</div>`);
    const sh=document.getElementById("sheet");sh.querySelector("#sosb").onclick=()=>{closeSheet();startBreath(1,null)};sh.querySelector("#sosm").onclick=openMessage;return}
  if(k==="thought"){
    let list=[];try{list=JSON.parse(localStorage.getItem("pp_thoughts")||"[]")}catch(e){}
    openSheet(`<h2>✍️ ${t("t_thought")}</h2><p style="color:var(--muted);font-size:.85rem;margin:0 0 10px">${t("th_priv")}</p>
      <div class="q"><div class="ql">${t("th_what")}</div><textarea id="thw" maxlength="300"></textarea></div>
      <div class="q"><div class="ql">${t("th_thought")}</div><textarea id="tht" maxlength="300"></textarea></div>
      <div class="q"><div class="ql">${t("th_calm")}</div><textarea id="thc" maxlength="300"></textarea></div>
      <button class="btn" id="ths">${t("th_save")}</button>
      ${list.length?`<h2 style="margin-top:18px">${t("th_list")}</h2>`+list.slice(-10).reverse().map(x=>`<div class="titem" style="display:block;margin-bottom:8px"><div style="font-size:.78rem;color:var(--muted)">${esc(x.d)}</div><div>💭 ${esc(x.t)}</div><div>🌿 ${esc(x.c)}</div></div>`).join(""):""}`);
    const sh=document.getElementById("sheet");
    sh.querySelector("#ths").onclick=()=>{const w=sh.querySelector("#thw").value.trim(),th=sh.querySelector("#tht").value.trim(),c=sh.querySelector("#thc").value.trim();if(!th||!c){toast("💭 + 🌿");return}
      list.push({d:new Date().toLocaleDateString(),w,t:th,c});try{localStorage.setItem("pp_thoughts",JSON.stringify(list.slice(-60)))}catch(e){}
      closeSheet();toast(t("th_saved"));hearts(8,["✍️","🌿","🐷"]);completeIfPlanned("thought")};return}
  if(k==="worry"){
    openSheet(`<h2>⏳ ${t("w_title")}</h2><p>${t("w_how")}</p><div class="big-time" id="wt">10:00</div><button class="btn" id="wgo">${t("w_start")}</button><button class="btn alt" id="wstop" style="margin-top:10px;display:none">${t("b_stop")}</button>`);
    const sh=document.getElementById("sheet");let left=600,iv=null;
    const draw=()=>{sh.querySelector("#wt").textContent=String(Math.floor(left/60)).padStart(2,"0")+":"+String(left%60).padStart(2,"0")};
    sh.querySelector("#wgo").onclick=()=>{sh.querySelector("#wgo").style.display="none";sh.querySelector("#wstop").style.display="block";keepAwake(true);
      iv=setInterval(()=>{left--;draw();if(left<=0){clearInterval(iv);keepAwake(false);closeSheet();toast(t("w_done"));hearts(8,["✅","🐷"]);completeIfPlanned("worry")}},1000)};
    sh.querySelector("#wstop").onclick=()=>{clearInterval(iv);keepAwake(false);closeSheet()};
    document.getElementById("scrim").onclick=()=>{clearInterval(iv);keepAwake(false);closeSheet()};return}
}
function completeIfPlanned(id){
  const tk=todayPlan().find(x=>x.id===id);if(!tk||doneSet(ST.today).has(id))return;
  setLog(ST.today,id,true);rpc("care_set_task",{p_day:ST.today,p_task:id,p_done:true}).then(()=>afterChange()).catch(()=>{setLog(ST.today,id,false);toast(t("net"));render()});
  floatXP(innerWidth/2,innerHeight/2,"+10 XP ⭐");render();
}

/* ---------- messages + hugs from Joel ---------- */
function openMessage(){
  openSheet(`<h2>💌 ${t("msg_title")}</h2><textarea id="mtxt" maxlength="1000" placeholder="${esc(t("msg_ph"))}" style="min-height:140px"></textarea><button class="btn" id="msend" style="margin-top:12px">${t("msg_send")}</button>`);
  const sh=document.getElementById("sheet");
  sh.querySelector("#msend").onclick=async()=>{const v=sh.querySelector("#mtxt").value.trim();if(!v)return;const b=sh.querySelector("#msend");b.disabled=true;
    try{await rpc("care_send",{p_kind:"message",p_body:v})}catch(e){toast(t("net"));b.disabled=false;return}
    ping("💌 A message from her","She sent you a message in the app. Open your console to read it.",4,"love_letter");closeSheet();toast(t("msg_sent"));hearts(10,["💌","💕","🐷"])};
}
function checkJoelHugs(){
  const ids=(ST.joel_hugs||[]);if(!ids.length)return;const max=Math.max(...ids);let seen=0;try{seen=+(localStorage.getItem("pp_jh")||0)}catch(e){}
  if(max>seen){try{localStorage.setItem("pp_jh",String(max))}catch(e){};if(seen===0&&ids.length>3)return;setTimeout(()=>{hearts(24,["🫂","💕","💗","🐷","💖"]);toast(t("joel_hug"));buzz()},600)}
}

/* ---------- breathing ---------- */
function isBreathTask(tk){return /^breathe|^wait$/.test(tk.id)||/呼吸/.test(tk.zh||"")&&tk.id!=="rest"}
function breathMinutes(tk){if(!tk)return 3;if(tk.id==="wait")return 3;const m=(tk.id.match(/(\d+)/)||[])[1]||((tk.zh||"").match(/(\d+)\s*分钟/)||[])[1];return m?Math.min(15,Math.max(1,+m)):5}
function breathNeeded(tk){return tk&&/各一次|两次|twice/.test((tk.zh||"")+(tk.en||""))?2:1}
function breathKey(tk){return "pp_b_"+ST.today+"_"+(tk?tk.id:"x")}
function openBreathLauncher(tk){
  const mins=breathMinutes(tk),need=breathNeeded(tk);let have=0;try{have=+(localStorage.getItem(breathKey(tk))||0)}catch(e){}
  openSheet(`<h2>🌬️ ${t("b_title")}</h2><p style="color:var(--muted);margin:0 0 12px">${t("b_hint")}</p>
   ${tk?`<p style="margin:0 0 12px"><strong>${esc(L==="zh"?tk.zh:(tk.en||tk.zh))}</strong>${need>1?` · ${have}/${need}`:""}</p>`:""}
   <div class="ql" style="margin-bottom:8px">${t("b_choose")}</div>
   <div class="opts" style="display:grid;gap:8px;grid-template-columns:repeat(4,minmax(0,1fr))">${[1,3,5,10].map(m=>`<button class="opt${m===mins?" on":""}" data-m="${m}">${t("b_min",{n:m})}</button>`).join("")}</div>
   <button class="btn" id="bgo" style="margin-top:16px">${t("b_start")}</button>${tk?`<button class="btn alt" id="bmark" style="margin-top:10px">${t("b_mark")}</button>`:""}`);
  const sh=document.getElementById("sheet");let pick=mins;
  sh.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{pick=+b.dataset.m;sh.querySelectorAll("[data-m]").forEach(o=>o.classList.toggle("on",o===b))});
  sh.querySelector("#bgo").onclick=()=>{closeSheet();startBreath(pick,tk)};
  const mk=sh.querySelector("#bmark");if(mk)mk.onclick=()=>{closeSheet();completeIfPlanned(tk.id)};
}
let wakeLock=null;
async function keepAwake(on){try{if(on&&navigator.wakeLock){wakeLock=await navigator.wakeLock.request("screen")}else if(!on&&wakeLock){await wakeLock.release();wakeLock=null}}catch(e){}}
function startBreath(mins,tk,onEnd){
  const el=document.getElementById("breath");const IN=4000,OUT=6000,CYC=IN+OUT,total=mins*60000;
  el.innerHTML=`<div style="font-weight:700;color:var(--muted)">${t("b_title")} · ${t("b_min",{n:mins})}</div>
    <div class="orb"><div class="orbring" id="bring"></div><div class="pigc">${pigSVG()}</div></div>
    <div class="bphase" id="bph"></div><div class="bcount" id="bct"></div><div class="btime" id="btm"></div>
    <div class="brow"><button class="btn alt" id="bpause">${t("b_pause")}</button><button class="btn alt" id="bstop">${t("b_stop")}</button></div>`;
  el.classList.add("on");keepAwake(true);
  const ring=el.querySelector("#bring"),ph=el.querySelector("#bph"),ct=el.querySelector("#bct"),tm=el.querySelector("#btm");
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  let elapsed=0,last=performance.now(),paused=false,raf=0,lastPhase="";
  const ease=x=>.5-Math.cos(Math.PI*x)/2;
  const frame=now=>{
    if(!paused)elapsed+=now-last;last=now;
    const c=elapsed%CYC,inhale=c<IN,p=inhale?c/IN:(c-IN)/OUT;
    const sc=inhale?.55+.45*ease(p):1-.45*ease(p);
    ring.style.transform=`scale(${reduce?(inhale?1:.7):sc})`;
    const phase=inhale?"in":"out";if(phase!==lastPhase){lastPhase=phase;ph.textContent=inhale?t("b_in"):t("b_out");buzz()}
    ct.textContent=String(Math.ceil(inhale?(IN-c)/1000:(CYC-c)/1000));
    const left=Math.max(0,total-elapsed);tm.textContent=`${Math.floor(left/60000)}:${String(Math.floor(left%60000/1000)).padStart(2,"0")} ${t("b_left")}`;
    if(elapsed>=total){finish(true);return}
    raf=requestAnimationFrame(frame);
  };
  const finish=done=>{cancelAnimationFrame(raf);keepAwake(false);el.classList.remove("on");
    if(onEnd)setTimeout(()=>onEnd(done),0);
    if(!done)return;
    if(tk){const need=breathNeeded(tk);let have=0;try{have=+(localStorage.getItem(breathKey(tk))||0)+1;localStorage.setItem(breathKey(tk),String(have))}catch(e){have=need}
      if(have>=need){toast(t("b_done"));confetti();hearts(12,["🌬️","🐷","✨"]);completeIfPlanned(tk.id)}else{toast(t("b_once"));hearts(8,["🌬️","⭐"])}}
    else{toast(t("b_done"));hearts(10,["🌬️","🐷","✨"])}
  };
  el.querySelector("#bpause").onclick=e=>{paused=!paused;e.target.textContent=paused?t("b_resume"):t("b_pause")};
  el.querySelector("#bstop").onclick=()=>finish(false);
  raf=requestAnimationFrame(frame);
}

/* ---------- badges ---------- */
function getSeen(){try{return JSON.parse(localStorage.getItem("pp_seen")||"[]")}catch(e){return []}}
function checkNewBadges(){
  const s=stats(),seen=new Set(getSeen()),fresh=BADGES.filter(b=>b.ok(s)&&!seen.has(b.id));
  if(!fresh.length)return;
  fresh.forEach(b=>seen.add(b.id));try{localStorage.setItem("pp_seen",JSON.stringify([...seen]))}catch(e){}
  if(!checkNewBadges._init){checkNewBadges._init=true;if(s.tasks===0&&s.checkins===0)return}
  const b=fresh[0];setTimeout(()=>{toast(`${b.e} ${t("newbadge")} ${L==="zh"?b.zh:b.en}`);hearts(10,[b.e,"✨","🐷"])},500);
}

/* ---------- boot ---------- */
async function load(){
  const app=document.getElementById("app");
  if(!KEY){app.innerHTML=`<div class="center"><div class="pig" style="margin:0 auto 12px;width:96px;height:96px">${pigSVG()}</div>${t("nolink")}</div>`;return}
  try{ST=await rpc("care_state",{});}
  catch(e){app.innerHTML=`<div class="center"><div class="pig" style="margin:0 auto 12px;width:96px;height:96px">${pigSVG("sleepy")}</div>${e.status===403||e.status===401?t("nolink"):t("net")}<br><br><button class="btn alt" id="retry" style="max-width:220px;margin:0 auto">↻</button></div>`;const r=document.getElementById("retry");if(r)r.onclick=load;return}
  document.getElementById("tabs").hidden=false;setTimeout(checkJoelHugs,300);
  try{const seen=getSeen();checkNewBadges._init=seen.length>0}catch(e){}
  render();
}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{TAB=b.dataset.t;render();scrollTo({top:0,behavior:"smooth"})});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&ST)load()});
load();
</script>
